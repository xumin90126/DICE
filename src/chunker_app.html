<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语义切片器 · DICE</title>
<style>
/* ═══════════ 设计系统：CSS 变量（浅色/夜间双主题） ═══════════ */
:root, [data-theme="light"] {
  color-scheme: light;
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface-2: #f1f3f6;
  --surface-3: #e9ecf1;
  --border: #e4e7ec;
  --border-strong: #d2d7e0;
  --text: #1a2130;
  --text-2: #5b6a7f;
  --text-3: #9aa5b6;
  --accent: #4f6ef7;
  --accent-hover: #3d5ce5;
  --accent-soft: rgba(79, 110, 247, .10);
  --accent-soft-2: rgba(79, 110, 247, .18);
  --green: #12a150;
  --green-soft: rgba(18, 161, 80, .12);
  --red: #d92d20;
  --red-soft: rgba(217, 45, 32, .10);
  --amber: #b4570a;
  --amber-soft: rgba(180, 87, 10, .12);
  --purple: #7a3ff2;
  --purple-soft: rgba(122, 63, 242, .12);
  --shadow-sm: 0 1px 2px rgba(16,24,40,.05);
  --shadow-md: 0 4px 16px rgba(16,24,40,.08);
  --shadow-lg: 0 12px 40px rgba(16,24,40,.16);
  --hover: rgba(15, 23, 42, .045);
  --active: rgba(15, 23, 42, .08);
  --topbar-h: 48px;
  --sidebar-w: 296px;
  --img-tint: rgba(255,255,255,0);
}
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0c0f16;
  --surface: #141926;
  --surface-2: #1b2231;
  --surface-3: #232c3e;
  --border: #232c3d;
  --border-strong: #33405a;
  --text: #e6eaf2;
  --text-2: #8fa0b8;
  --text-3: #5d6c85;
  --accent: #6f8bff;
  --accent-hover: #82a0ff;
  --accent-soft: rgba(111, 139, 255, .14);
  --accent-soft-2: rgba(111, 139, 255, .24);
  --green: #34d17b;
  --green-soft: rgba(52, 209, 123, .14);
  --red: #f97066;
  --red-soft: rgba(249, 112, 102, .14);
  --amber: #f5a623;
  --amber-soft: rgba(245, 166, 35, .14);
  --purple: #a37dff;
  --purple-soft: rgba(163, 125, 255, .16);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
  --shadow-md: 0 4px 16px rgba(0,0,0,.35);
  --shadow-lg: 0 12px 40px rgba(0,0,0,.5);
  --hover: rgba(255,255,255,.05);
  --active: rgba(255,255,255,.09);
  --img-tint: rgba(255,255,255,0);
}

* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  transition: background .25s ease, color .25s ease;
}
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: var(--text-3); border: 2px solid transparent; background-clip: padding-box; }

button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; }

/* ═══════════ 布局骨架 ═══════════ */
#app { display:flex; flex-direction:column; height:100vh; }

/* ─── 顶部工具栏 ─── */
#topbar {
  height: var(--topbar-h);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 12px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  z-index: 30;
}
.brand { display:flex; align-items:center; gap:8px; margin-right:12px; user-select:none; }
.brand .logo {
  width: 26px; height: 26px; border-radius: 8px;
  background: linear-gradient(135deg, #6f8bff, #4f6ef7 60%, #7a3ff2);
  display:flex; align-items:center; justify-content:center;
  box-shadow: 0 2px 6px rgba(79,110,247,.35);
}
.brand .logo svg { width:15px; height:15px; }
.brand .name { font-weight:650; font-size:13.5px; letter-spacing:.2px; }
.brand .name em { font-style:normal; color:var(--accent); }

.breadcrumb { display:flex; align-items:center; gap:2px; font-size:12.5px; color:var(--text-2); min-width:0; }
.breadcrumb .crumb { padding:3px 7px; border-radius:6px; cursor:pointer; white-space:nowrap; }
.breadcrumb .crumb:hover { background: var(--hover); color: var(--text); }
.breadcrumb .crumb.doc { color: var(--text); font-weight:550; }
.breadcrumb .sep { color: var(--text-3); font-size:11px; }

.toolbar-spacer { flex:1; }

/* 通用按钮 */
.tbtn {
  display:inline-flex; align-items:center; gap:6px;
  height:30px; padding:0 10px;
  border:1px solid var(--border);
  border-radius:8px;
  background: var(--surface);
  color: var(--text-2);
  font-size:12.5px;
  transition: all .15s;
  white-space:nowrap;
}
.tbtn:hover { background: var(--surface-2); color: var(--text); border-color: var(--border-strong); }
.tbtn svg { width:15px; height:15px; }
.tbtn.primary { background: var(--accent); border-color: var(--accent); color:#fff; }
.tbtn.primary:hover { background: var(--accent-hover); }
.tbtn.icon-btn { width:30px; padding:0; justify-content:center; }

/* 搜索触发器 */
#search-trigger {
  width: 260px; justify-content: flex-start; color: var(--text-3);
  border-radius: 8px; margin: 0 8px;
}
#search-trigger .kbd {
  margin-left:auto;
  font-size:10.5px; color:var(--text-3);
  border:1px solid var(--border); border-bottom-width:2px;
  border-radius:4px; padding:1px 5px;
  background: var(--surface-2);
}

/* 主题切换 */
#theme-toggle { position:relative; }

/* ═══════════ 主区域 ═══════════ */
#main { flex:1; display:flex; overflow:hidden; position:relative; }

/* ─── 左侧文档库 ─── */
#library {
  width: var(--sidebar-w);
  min-width: 220px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow: hidden;
}
.lib-head { padding: 10px 12px 4px; }
.lib-head .row { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.lib-head h3 { font-size:11px; font-weight:650; color:var(--text-3); text-transform:uppercase; letter-spacing:.8px; }
.lib-stats { font-size: 11px; color: var(--text-3); }
#lib-search {
  width:100%; height:30px; padding:0 10px 0 32px;
  border:1px solid var(--border); border-radius:8px;
  background: var(--surface-2); color:var(--text);
  font-size:12.5px; outline:none; transition:border .15s, box-shadow .15s;
}
#lib-search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.lib-search-wrap { position:relative; }
.lib-search-wrap svg { position:absolute; left:9px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--text-3); pointer-events:none; }

#lib-body { flex:1; overflow-y:auto; padding: 6px 8px 12px; }

/* 树节点 */
.tree { list-style:none; }
.tree-item { user-select:none; }
.tree-row {
  display:flex; align-items:center; gap:6px;
  height:28px; padding:0 8px;
  border-radius:7px;
  cursor:pointer;
  color:var(--text-2);
  font-size:12.5px;
  position:relative;
  transition: background .12s;
}
.tree-row:hover { background: var(--hover); color:var(--text); }
.tree-row.active { background: var(--accent-soft); color: var(--accent); font-weight:550; }
.tree-row .arrow {
  width:14px; height:14px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  color:var(--text-3); transition: transform .18s ease;
}
.tree-row .arrow svg { width:12px; height:12px; }
.tree-row.open .arrow { transform: rotate(90deg); }
.tree-row .ic { width:16px; height:16px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
.tree-row .ic svg { width:15px; height:15px; }
.tree-row .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tree-row .cnt {
  font-size:10.5px; color:var(--text-3);
  background: var(--surface-3); border-radius:9px;
  padding:1px 7px; min-width:20px; text-align:center;
}
.tree-row.active .cnt { background: var(--accent-soft-2); color: var(--accent); }
.tree-row .more {
  width:20px; height:20px; border-radius:5px; display:none;
  align-items:center; justify-content:center; color:var(--text-3);
}
.tree-row:hover .more { display:flex; }
.tree-row .more:hover { background: var(--active); color: var(--text); }
.tree-row .more svg { width:13px; height:13px; }

.tree-children { padding-left: 22px; }
.tree-children.collapsed { display:none; }

/* 文档行（在文件夹内 / 未归档内） */
.doc-row {
  display:flex; align-items:center; gap:7px;
  height:26px; padding:0 8px 0 6px;
  border-radius:6px;
  cursor:pointer;
  color:var(--text-2);
  font-size:12px;
  transition: background .12s;
  position: relative;
}
.doc-row:hover { background: var(--hover); color:var(--text); }
.doc-row.active { background: var(--accent-soft); color: var(--accent); font-weight:550; }
.doc-row .dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
.doc-row .dot.ds { background: var(--green); }
.doc-row .dot.paper { background: var(--purple); }
.doc-row .fname { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:"SF Mono", Menlo, monospace; font-size:11.5px; letter-spacing:.2px; }
.doc-row .save-flag { color: var(--amber); font-size:9px; }
.doc-row.active .fname { color: var(--accent); }
.doc-row.dragging { opacity:.4; }

/* 拖拽目标高亮 */
.tree-item.drop-hover .tree-row, .tree-item.drop-hover .tree-children {
  outline: 1.5px solid var(--accent);
  outline-offset: -1.5px;
  border-radius: 8px;
}
.tree-item.drop-hover .tree-row { background: var(--accent-soft); }

/* 空态 */
.lib-empty { text-align:center; color:var(--text-3); font-size:12px; padding: 24px 12px; }

/* ─── 分隔条 ─── */
.resizer { width:4px; flex-shrink:0; cursor:col-resize; background:transparent; transition:background .15s; position:relative; z-index:10; }
.resizer:hover, .resizer.dragging { background: var(--accent-soft-2); }
.resizer::after { content:""; position:absolute; left:1px; top:0; bottom:0; width:2px; background:var(--border); }
.resizer:hover::after, .resizer.dragging::after { background:var(--accent); }

/* ─── 中间 PDF ─── */
#pdf-panel { display:flex; flex-direction:column; overflow:hidden; min-width:180px; flex:0 0 46%; background: var(--bg); }
.panel-head {
  height: 38px; flex-shrink:0;
  display:flex; align-items:center; gap:6px;
  padding: 0 14px;
  font-size:12px; color:var(--text-2);
  background: var(--surface);
  border-bottom:1px solid var(--border);
}
.panel-head .title { font-weight:600; color:var(--text); }
.panel-head .sub { color:var(--text-3); font-size:11px; }
.panel-head .spacer { flex:1; }
#pdf-viewer { flex:1; overflow-y:auto; padding: 10px 12px; }
.pdf-page { margin-bottom:10px; border:1px solid var(--border); border-radius:8px; overflow:hidden; background: var(--surface); box-shadow: var(--shadow-sm); cursor:pointer; transition: box-shadow .15s, border-color .15s; }
.pdf-page:hover { box-shadow: var(--shadow-md); }
.pdf-page.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.pdf-page .pl { display:flex; justify-content:space-between; align-items:center; padding:3px 10px; background: var(--surface-2); font-size:10.5px; color:var(--text-3); font-family:"SF Mono",monospace; }
.pdf-page img { display:block; width:100%; }

/* ─── 右侧切片 ─── */
#chunk-panel { display:flex; flex-direction:column; overflow:hidden; min-width:280px; flex:1 1 0; background:var(--surface); }
#chunk-list { flex:1; overflow-y:auto; padding: 12px; }

/* 切片卡片 */
.chunk-card {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 10px;
  overflow: hidden;
  transition: border-color .15s, box-shadow .15s;
}
.chunk-card:hover { border-color: var(--border-strong); }
.chunk-card.level-1 { border-left: 3px solid var(--purple); }
.chunk-card.level-2 { border-left: 3px solid var(--accent); }
.chunk-card.level-3 { border-left: 3px solid var(--green); margin-left: 18px; }
.chunk-card.dragover { box-shadow: 0 0 0 2px var(--accent); }
.chunk-head { display:flex; align-items:center; gap:8px; padding:9px 12px; cursor:pointer; }
.chunk-head .tic { font-size:14px; width:18px; text-align:center; flex-shrink:0; }
.chunk-head .title { flex:1; min-width:0; font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.chunk-card.level-1 .title { color: var(--purple); }
.chunk-card.level-2 .title { color: var(--text); }
.chunk-card.level-3 .title { color: var(--green); }
.chunk-head .pages { font-size:10.5px; color:var(--text-3); font-family:"SF Mono",monospace; flex-shrink:0; }
.chunk-head .chev { color:var(--text-3); display:flex; transition: transform .18s; flex-shrink:0; }
.chunk-head .chev svg { width:12px; height:12px; }
.chunk-card.collapsed .chev { transform: rotate(-90deg); }
.chunk-card.collapsed .chunk-body-wrap, .chunk-card.collapsed .chunk-children { display:none; }
.edit-badge { font-size:10px; padding:1px 6px; border-radius:5px; background: var(--amber-soft); color: var(--amber); white-space:nowrap; font-family:"SF Mono",monospace; flex-shrink:0; }

.chunk-body-wrap { padding: 0 12px 10px; }
.chunk-content {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  max-height: 320px;
  overflow-y: auto;
  font-size: 12.5px;
  line-height: 1.7;
}
.chunk-element { margin-bottom: 7px; }
.chunk-element:last-child { margin-bottom: 0; }
.chunk-element.paragraph { color: var(--text-2); white-space: pre-wrap; }
.chunk-element.table { overflow-x: auto; }
.chunk-element.table table { border-collapse: collapse; width:100%; font-size:11.5px; }
.chunk-element.table th { background: var(--surface-2); color: var(--accent); padding:5px 9px; border:1px solid var(--border); text-align:left; font-weight:600; }
.chunk-element.table td { padding:4px 9px; border:1px solid var(--border); color: var(--text-2); }
.chunk-element.table tr:nth-child(even) td { background: var(--surface-2); }
.chunk-element.image img { max-width:100%; border-radius:8px; border:1px solid var(--border); cursor:zoom-in; display:block; transition: opacity .15s; }
.chunk-element.image img:hover { opacity:.9; }
.chunk-element.image .cap { font-size:11px; color:var(--text-3); font-style:italic; margin-top:4px; }

.chunk-actions { display:flex; gap:4px; padding: 2px 12px 10px; flex-wrap:wrap; }
.act-btn {
  display:inline-flex; align-items:center; gap:4px;
  height:22px; padding:0 8px;
  border-radius:6px; border:1px solid var(--border);
  background: var(--surface); color:var(--text-2);
  font-size:11px;
  transition: all .12s;
}
.act-btn:hover { border-color: var(--accent); color: var(--accent); }
.act-btn.danger:hover { border-color: var(--red); color: var(--red); background: var(--red-soft); }
.act-btn.add:hover { border-color: var(--green); color: var(--green); background: var(--green-soft); }
.act-btn svg { width:11px; height:11px; }

/* 子切片标签 */
.chunk-children { padding: 0 12px 2px; }
.child-label { font-size:10px; color:var(--text-3); text-transform:uppercase; letter-spacing:.6px; margin:4px 0 6px; }

/* ─── 空态主区 ─── */
#workspace-empty {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:var(--text-3); gap:10px;
}
#workspace-empty .big-ic { font-size:40px; opacity:.6; }

/* ═══════════ 命令面板（搜索） ═══════════ */
#cmd-palette { position:fixed; inset:0; z-index:200; display:none; align-items:flex-start; justify-content:center; background: rgba(0,0,0,.4); backdrop-filter: blur(2px); padding-top:12vh; }
#cmd-palette.show { display:flex; }
#cmd-box { width: 560px; max-width: 92vw; background: var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow: var(--shadow-lg); overflow:hidden; animation: pop .16s ease; }
@keyframes pop { from { transform: translateY(-8px) scale(.99); opacity:0; } to { transform:none; opacity:1; } }
#cmd-input-wrap { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--border); }
#cmd-input-wrap svg { width:18px; height:18px; color: var(--text-3); flex-shrink:0; }
#cmd-input { flex:1; border:none; outline:none; background:transparent; color:var(--text); font-size:15px; }
#cmd-input::placeholder { color: var(--text-3); }
#cmd-results { max-height: 380px; overflow-y:auto; padding: 6px; }
.cmd-group { font-size:10.5px; color:var(--text-3); text-transform:uppercase; letter-spacing:.7px; padding:8px 10px 4px; }
.cmd-item { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; cursor:pointer; }
.cmd-item:hover, .cmd-item.sel { background: var(--accent-soft); }
.cmd-item .ic { width:28px; height:28px; border-radius:7px; background:var(--surface-3); display:flex; align-items:center; justify-content:center; color:var(--text-2); flex-shrink:0; }
.cmd-item .ic svg { width:14px; height:14px; }
.cmd-item .body { flex:1; min-width:0; }
.cmd-item .body .t1 { font-size:13px; color:var(--text); font-weight:550; }
.cmd-item .body .t2 { font-size:11px; color:var(--text-3); margin-top:1px; }
.cmd-item .hint { font-size:10px; color:var(--text-3); background:var(--surface-3); padding:2px 6px; border-radius:4px; }
#cmd-empty { text-align:center; color:var(--text-3); padding:30px; font-size:13px; }

/* ═══════════ 模态 ═══════════ */
.modal-overlay { position:fixed; inset:0; z-index:150; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.45); backdrop-filter: blur(3px); }
.modal-overlay.show { display:flex; }
.modal {
  width: 620px; max-width: 94vw; max-height: 86vh;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: var(--shadow-lg);
  display: flex; flex-direction: column;
  overflow: hidden;
  animation: pop .16s ease;
}
.modal-head { display:flex; align-items:center; justify-content:space-between; padding: 16px 20px 0; }
.modal-head h3 { font-size:15px; font-weight:650; }
.modal-head .x { border:none; background:transparent; color:var(--text-3); width:26px; height:26px; border-radius:7px; display:flex; align-items:center; justify-content:center; }
.modal-head .x:hover { background:var(--hover); color:var(--text); }
.modal-head .x svg { width:15px; height:15px; }
.modal-body { padding: 16px 20px; overflow-y:auto; }
.modal-foot { display:flex; justify-content:flex-end; gap:8px; padding: 14px 20px 18px; border-top:1px solid var(--border); }

.modal label.f { display:block; font-size:12px; color:var(--text-2); font-weight:550; margin: 0 0 5px; }
.modal input[type=text], .modal select, .modal textarea, .edit-elem textarea {
  width:100%; padding:8px 11px; margin-bottom:14px;
  border:1px solid var(--border); border-radius:9px;
  background: var(--surface-2); color: var(--text);
  font-size:13px; outline:none; transition: border .15s, box-shadow .15s;
}
.modal input[type=text]:focus, .modal select:focus, .modal textarea:focus, .edit-elem textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.modal .hint { font-size:11px; color:var(--text-3); margin-top:-8px; margin-bottom:14px; }
.btn {
  height:32px; padding:0 14px;
  border-radius:8px; border:1px solid var(--border);
  background: var(--surface); color: var(--text-2);
  font-size:12.5px; font-weight:550;
  transition: all .15s;
  display:inline-flex; align-items:center; gap:6px;
}
.btn:hover { background: var(--surface-2); color:var(--text); border-color:var(--border-strong); }
.btn.primary { background: var(--accent); border-color: var(--accent); color:#fff; }
.btn.primary:hover { background: var(--accent-hover); }
.btn.danger { color: var(--red); }
.btn.danger:hover { background: var(--red-soft); border-color: var(--red); }
.btn:disabled { opacity:.5; cursor:not-allowed; }

/* 编辑切片元素 */
.edit-elem { border:1px solid var(--border); border-radius:10px; margin-bottom:10px; overflow:hidden; background: var(--surface); }
.edit-elem-head { display:flex; align-items:center; justify-content:space-between; padding:5px 12px; background: var(--surface-2); font-size:11px; color:var(--text-2); font-weight:600; }
.edit-elem-head .label { display:flex; align-items:center; gap:6px; }
.edit-elem-body { padding:10px 12px; }
.edit-elem textarea { margin-bottom:0; min-height:50px; font-size:12.5px; line-height:1.6; }
.edit-elem-img { max-width:100%; border-radius:8px; border:1px solid var(--border); margin-bottom:8px; cursor:zoom-in; }
.edit-elem-caption { width:100%; padding:6px 10px; border:1px solid var(--border); border-radius:8px; background: var(--surface-2); color:var(--text); font-size:12px; outline:none; }
.edit-elem-caption:focus { border-color: var(--accent); }
.edit-elem table { border-collapse:collapse; width:100%; font-size:11.5px; }
.edit-elem th { background: var(--surface-2); color: var(--accent); padding:4px 8px; border:1px solid var(--border); text-align:left; }
.edit-elem td { padding:3px 8px; border:1px solid var(--border); color:var(--text-2); }

/* 图片大图 */
#img-lightbox { position:fixed; inset:0; z-index:250; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.88); }
#img-lightbox.show { display:flex; }
#img-lightbox .wrap { max-width:94vw; max-height:92vh; display:flex; flex-direction:column; gap:10px; }
#img-lightbox .cap { color:#cfd6e4; font-size:13px; text-align:center; }
#img-lightbox img { max-width:94vw; max-height:86vh; border-radius:10px; }
#img-lightbox .x { position:absolute; top:14px; right:16px; background:rgba(255,255,255,.12); border:none; color:#fff; width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px; }
#img-lightbox .x:hover { background:rgba(255,255,255,.25); }

/* loading toast */
#toast { position:fixed; top:60px; left:50%; transform:translateX(-50%) translateY(-8px); z-index:300; background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow-md); padding:9px 18px; font-size:13px; display:flex; align-items:center; gap:8px; opacity:0; pointer-events:none; transition: all .2s; }
#toast.show { opacity:1; transform:translateX(-50%); }
#toast .spinner { width:14px; height:14px; border:2px solid var(--accent); border-top-color:transparent; border-radius:50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 下拉菜单 */
.dropdown { position:fixed; z-index:180; background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow: var(--shadow-lg); min-width:180px; padding:4px; display:none; }
.dropdown.show { display:block; animation: pop .12s ease; }
.dd-item { display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:7px; font-size:12.5px; color:var(--text-2); cursor:pointer; }
.dd-item:hover { background: var(--hover); color: var(--text); }
.dd-item.danger:hover { background: var(--red-soft); color: var(--red); }
.dd-item svg { width:14px; height:14px; }
.dd-sep { height:1px; background:var(--border); margin:4px 6px; }
.dd-title { font-size:10.5px; color:var(--text-3); text-transform:uppercase; letter-spacing:.7px; padding:6px 10px 3px; }

/* 归档动画提示 */
.move-flash { animation: flash .6s ease; }
@keyframes flash { 0% { background: var(--accent-soft-2); } 100% { background: transparent; } }

/* ═══════════ 文档库收起状态 ═══════════ */
body.lib-collapsed #library { display:none; }
body.lib-collapsed #resizer-lib { display:none; }
body.lib-collapsed #pdf-panel { flex-basis: 58%; }

@media (max-width: 900px) {
  #library { position:absolute; left:0; top:var(--topbar-h); bottom:0; z-index:40; box-shadow:var(--shadow-lg); }
  #library.collapsed-mobile { display:none; }
}
</style>
</head>
<body>

<div id="app">
  <!-- ═══ 顶部工具栏 ═══ -->
  <header id="topbar">
    <button class="tbtn icon-btn" id="lib-toggle" onclick="toggleLibrary()" title="收起 / 展开文档库">
      <svg id="lib-ic-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6v16H4z"/><path d="M14 4h6v16h-6z"/><path d="M14 8h6M14 12h6M14 16h6"/></svg>
      <svg id="lib-ic-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M4 4h6v16H4z"/><path d="M14 4h6v16h-6z" opacity=".4"/><path d="M14 8h6M14 12h6M14 16h6" opacity=".4"/></svg>
    </button>
    <div class="brand" title="语义切片器 · DICE">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18M3 9h6M3 15h6" opacity=".55"/><path d="m14 11 3 3-3 3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="name"><em>语义切片器</em></div>
    </div>
    <nav class="breadcrumb" id="breadcrumb"></nav>
    <div class="toolbar-spacer"></div>
    <button class="tbtn" id="search-trigger" onclick="openPalette()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      搜索文档…
      <span class="kbd">⌘K</span>
    </button>
    <button class="tbtn" onclick="openNewFolder()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v4M10 13h4"/></svg>
      新建文件夹
    </button>
    <button class="tbtn icon-btn" id="theme-toggle" onclick="toggleTheme()" title="切换浅色/夜间主题">
      <svg id="theme-ic-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg id="theme-ic-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <!-- ═══ 主区域 ═══ -->
  <div id="main">
    <!-- 左侧文档库 -->
    <aside id="library">
      <div class="lib-head">
        <div class="row">
          <h3>文档库</h3>
          <span class="lib-stats" id="lib-stats"></span>
        </div>
        <div class="lib-search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="lib-search" type="text" placeholder="在库中搜索…" oninput="onLibSearch(this.value)">
        </div>
      </div>
      <div id="lib-body"></div>
    </aside>

    <div class="resizer" id="resizer-lib"></div>

    <!-- 中间：PDF -->
    <section id="pdf-panel">
      <div class="panel-head">
        <span class="title" id="pdf-title">文档预览</span>
        <span class="spacer"></span>
        <span class="sub" id="pdf-sub"></span>
      </div>
      <div id="pdf-viewer"></div>
    </section>

    <div class="resizer" id="resizer-chunk"></div>

    <!-- 右侧：切片 -->
    <section id="chunk-panel">
      <div class="panel-head">
        <span class="title">语义切片</span>
        <span class="sub" id="chunk-info"></span>
        <span class="spacer"></span>
        <button class="tbtn" style="height:26px;padding:0 8px;font-size:11.5px" onclick="rechunk()" title="重新自动切片（丢弃手动修改）">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
          重新切片
        </button>
        <button class="tbtn" style="height:26px;padding:0 8px;font-size:11.5px" onclick="saveChunks()" title="保存手动调整">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
          保存
        </button>
        <button class="tbtn" style="height:26px;padding:0 8px;font-size:11.5px" onclick="exportJSON()" title="导出切片 JSON">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
          导出

      <div id="chunk-list"></div>

</div>

<!-- ═══ 命令面板 ═══ -->
<div id="cmd-palette" onclick="if(event.target===this)closePalette()">
  <div id="cmd-box">
    <div id="cmd-input-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="cmd-input" type="text" placeholder="搜索文档 / 文件夹…" autocomplete="off" oninput="onPaletteInput(this.value)" onkeydown="onPaletteKey(event)">
    </div>
    <div id="cmd-results"></div>

</div>

<!-- ═══ 新建/编辑文件夹模态 ═══ -->
<div class="modal-overlay" id="folder-modal" onclick="if(event.target===this)closeFolderModal()">
  <div class="modal" style="width:460px">

      <h3 id="folder-modal-title">新建文件夹</h3>
      <button class="x" onclick="closeFolderModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>

<!-- ═══ 编辑切片模态 ═══ -->

<!-- ═══ 图片大图 ═══ -->

<div id="toast"></div>

<!-- ═══ 下拉菜单容器 ═══ -->
<div class="dropdown" id="dropdown"></div>

<script>
/* ═════════════════ 全局状态 ═════════════════ */
const LIB = { folders: [], unarchived: [], all: [], total: 0 };
let currentDoc = null;        // 当前打开的文档 id
let currentData = null;       // 当前文档数据
let editTarget = null;        // 编辑切片索引
let activeFolder = 'all';     // 'all' | 'unfiled' | folder_id | null(无高亮)
let paletteSel = -1;          // 命令面板选中项
let paletteResults = [];
let theme = null;
let libCollapsed = false;     // 文档库是否收起

/* 工具 SVG 图标 */
const IC = {
  folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>',
  chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>',
  more: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>',
  inbox: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13l3.5 7v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/></svg>',
  all: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
  docs: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>',
  pen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  move: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>',
};

/* ═════════════════ 主题 ═════════════════ */
function initTheme() {
  const saved = localStorage.getItem('dice-theme');
  if (saved === 'light' || saved === 'dark') {
    setTheme(saved);
  } else {
    // 默认跟随系统
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    setTheme(prefersDark ? 'dark' : 'light');
  }
}
function setTheme(t) {
  theme = t;
  document.documentElement.dataset.theme = t;
  const isDark = t === 'dark';
  document.getElementById('theme-ic-dark').style.display = isDark ? 'none' : '';
  document.getElementById('theme-ic-light').style.display = isDark ? '' : 'none';
}
function toggleTheme() {
  setTheme(theme === 'dark' ? 'light' : 'dark');
  localStorage.setItem('dice-theme', theme);
}

/* ═════════════════ 文档库收起/展开 ═════════════════ */
function applyLibraryCollapsed() {
  document.body.classList.toggle('lib-collapsed', libCollapsed);
  const openIc = document.getElementById('lib-ic-open');
  const closedIc = document.getElementById('lib-ic-closed');
  if (openIc) openIc.style.display = libCollapsed ? 'none' : '';
  if (closedIc) closedIc.style.display = libCollapsed ? '' : 'none';
}
function toggleLibrary() {
  libCollapsed = !libCollapsed;
  localStorage.setItem('dice-lib-collapsed', libCollapsed ? '1' : '0');
  applyLibraryCollapsed();
}
function initLibraryCollapsed() {
  libCollapsed = localStorage.getItem('dice-lib-collapsed') === '1';
  applyLibraryCollapsed();
}

/* ═════════════════ 文档库 ═════════════════ */
const openSet = new Set(['all']);  // 展开的文件夹/根节点 id
let libFilter = '';

async function loadLibrary() {
  try {
    const res = await fetch('/api/library');
    const lib = await res.json();
    LIB.folders = lib.folders;
    LIB.unarchived = lib.unarchived;
    LIB.all = [];
    lib.folders.forEach(f => f.docs.forEach(d => { d._folder = f.id; LIB.all.push(d); }));
    lib.unarchived.forEach(d => { d._folder = null; LIB.all.push(d); });
    LIB.total = lib.total_docs;
    document.getElementById('lib-stats').textContent = `${LIB.total} 份`;
    renderLibrary();
  } catch(e) { console.error('加载文档库失败', e); }
}

function renderLibrary(filter) {
  if (typeof filter === 'string') libFilter = filter;
  const q = libFilter.toLowerCase().trim();
  const body = document.getElementById('lib-body');
  const searching = !!q;

  // 构建节点列表：全部 / 未归档 / 各文件夹（含匹配子文档）
  const nodes = [];
  const allDocs = searching ? LIB.all.filter(d => d.doc_id.toLowerCase().includes(q)) : LIB.all;
  const unfDocs = searching ? LIB.unarchived.filter(d => d.doc_id.toLowerCase().includes(q)) : LIB.unarchived;
  nodes.push({ id:'all', name:'全部文档', icon:IC.all, docs: allDocs, folder:null });
  nodes.push({ id:'unfiled', name:'未归档', icon:IC.inbox, docs: unfDocs, folder:null });
  LIB.folders.forEach(f => {
    const fnameMatch = f.name.toLowerCase().includes(q);
    let fdocs = searching ? f.docs.filter(d => d.doc_id.toLowerCase().includes(q)) : f.docs;
    if (searching) {
      // 文件夹名匹配时显示全部子文档，否则只显示匹配的子文档
      if (fnameMatch && !fdocs.length) fdocs = f.docs;
      if (!fnameMatch && !fdocs.length) return;
    }
    nodes.push({ id:f.id, name:f.name, icon:IC.folder, docs: fdocs, folder:f });
  });

  let html = '<ul class="tree">';
  nodes.forEach(n => {
    const isOpen = openSet.has(n.id) || searching;
    const isActive = activeFolder === n.id;
    const hasChildren = n.docs.length > 0;
    html += `<li class="tree-item" data-folder-item="${n.id}">
      <div class="tree-row ${isActive?'active':''} ${isOpen?'open':''}" data-folder="${n.id}"
           onclick="toggleTree('${n.id}')" title="${escapeHtml(n.name)}">
        <span class="arrow">${IC.chev}</span>
        <span class="ic">${n.icon}</span>
        <span class="name">${escapeHtml(n.name)}</span>
        <span class="cnt">${hasChildren ? n.docs.length : 0}</span>
        ${n.folder ? `<span class="more" onclick="event.stopPropagation();folderMenu(event,'${n.folder.id}')">${IC.more}</span>` : ''}
      </div>`;
    if (isOpen) {
      html += `<ul class="tree-children" id="tch-${n.id}">`;
      if (hasChildren) {
        html += n.docs.map(docRow).join('');
      } else {
        html += `<li class="lib-empty" style="padding:6px 8px">${n.id==='unfiled' ? '没有未归档文档' : '（空文件夹）'}</li>`;
      }
      html += '</ul>';
    }
    html += '</li>';
  });
  html += '</ul>';
  body.innerHTML = html;
}

function docRow(d) {
  const act = currentDoc === d.doc_id ? 'active' : '';
  const saveFlag = d.has_save ? '<span class="save-flag" title="有手动保存的切片">●</span>' : '';
  return `<div class="doc-row ${act}" data-doc="${d.doc_id}" onclick="openDoc('${d.doc_id}')" draggable="true"
    ondragstart="onDocDragStart(event,'${d.doc_id}')" ondragend="this.classList.remove('dragging')">
    <span class="dot ${d.doc_type === 'paper' ? 'paper' : 'ds'}"></span>
    <span class="fname">${escapeHtml(d.doc_id)}</span>${saveFlag}
  </div>`;
}

function toggleTree(id) {

  if (wasOpen) {

    openSet.delete(id);
    if (activeFolder === id) activeFolder = null;
  } else {
    // 展开：激活
    openSet.add(id);
    activeFolder = id;
  }
  renderLibrary();
}
function selectFolder(id) {
  openSet.add(id);
  activeFolder = id;
  renderLibrary();
  const tc = document.getElementById(`tch-${id}`);
  if (tc) tc.scrollIntoView({ block:'nearest' });

function onLibSearch(v) {
  renderLibrary(v);
}

/* 拖拽归档（事件委托：整个树项 + 文档行均可作为目标） */
let dragDocId = null;
function onDocDragStart(e, docId) {
  dragDocId = docId;
  e.target.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', docId);
}

function setupDragHandlers() {
  const body = document.getElementById('lib-body');
  // dragover：命中任意树项 → 高亮并允许 drop
  body.addEventListener('dragover', e => {
    const item = e.target.closest('.tree-item');
    if (!item || !dragDocId) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    document.querySelectorAll('.tree-item.drop-hover').forEach(x => x.classList.remove('drop-hover'));
    item.classList.add('drop-hover');
  });
  body.addEventListener('dragleave', e => {
    if (e.target.closest && !e.target.closest('.tree-item')) {
      document.querySelectorAll('.tree-item.drop-hover').forEach(x => x.classList.remove('drop-hover'));
    }
  });
  // drop：找到所属树项 → 归档
  body.addEventListener('drop', e => {
    e.preventDefault();
    document.querySelectorAll('.tree-item.drop-hover').forEach(x => x.classList.remove('drop-hover'));
    const item = e.target.closest('.tree-item');
    if (!item) return;
    const folderId = item.dataset.folderItem;
    let docId = dragDocId || e.dataTransfer.getData('text/plain');
    dragDocId = null;
    if (!docId) return;
    if (folderId === 'all') return; // 全部文档不是归档目标
    if (folderId === 'unfiled') {
      moveDocToFolder(docId, null);   // 拖到"未归档" = 移出手动映射
    } else {
      moveDocToFolder(docId, folderId);
    }
  });
}

/* 文档 → 文件夹移动 */
async function moveDocToFolder(docId, folderId) {
  showToast('移动中…', true);
  try {
    const res = await fetch(`/api/docs/${docId}/folder`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ folder_id: folderId }),
    });
    const lib = await res.json();
    if (lib.error) throw new Error(lib.error);
    hideToast();
    showToast(folderId ? '已归档 ✅' : '已移回未归档 📥', false, 1400);
    await loadLibrary();
    renderWorkspace(); // 刷新面包屑
  } catch(e) {
    hideToast();
    alert('移动失败: ' + e.message);
  }
}

/* 文件夹菜单（⋯） */
function folderMenu(e, folderId) {
  e.stopPropagation();

/* ═════════════════ 文件夹 CRUD ═════════════════ */
let editingFolderId = null;
function openNewFolder() {

  document.getElementById('folder-modal-title').textContent = '新建文件夹';

  document.getElementById('folder-pattern').value = '';

}
function openEditFolder(folderId) {

}
function closeFolderModal() {

}
async function submitFolder() {

  const pattern = document.getElementById('folder-pattern').value.trim();

async function deleteFolder(folderId) {

    alert('删除失败: ' + e.message);

/* ═════════════════ 打开文档 ═════════════════ */
async function openDoc(docId) {
  if (currentDoc === docId && currentData) { scrollToPage(1); return; }
  showToast('加载文档 + 切片…', true);
  currentDoc = docId;
  // 展开并高亮文档所在位置
  revealDocInLibrary(docId);
  try {
    const res = await fetch(`/api/doc/${docId}`);
    currentData = await res.json();
    if (currentData.error) throw new Error(currentData.error);
    hideToast();
    renderWorkspace();
  } catch(e) {
    hideToast();
    alert('加载失败: ' + e.message);
    currentDoc = null;
    renderLibrary();

}

function revealDocInLibrary(docId) {
  const it = LIB.all.find(x => x.doc_id === docId);
  const folderId = it && it._folder ? it._folder : 'unfiled';
  activeFolder = folderId;
  openSet.add(folderId);
  document.getElementById('lib-search').value = '';
  libFilter = '';
  renderLibrary();
}

function renderWorkspace() {
  if (!currentData) return;
  const d = currentData;
  // 面包屑
  let folderName = '全部文档';
  if (d.doc_id) {
    // 找所属文件夹

    if (inFolder && inFolder._folder) {
      const f = LIB.folders.find(x => x.id === inFolder._folder);
      if (f) folderName = f.name;
    } else if (inFolder && !inFolder._folder) {
      folderName = '未归档';
    }
  }

    `<span class="crumb" onclick="selectFolder('all')">文档库</span>
     <span class="sep">/</span>
     <span class="crumb" onclick="selectFolder('${inFolderId(d.doc_id)}')">${escapeHtml(folderName)}</span>
     <span class="sep">/</span>
     <span class="crumb doc">${escapeHtml(d.doc_id)}</span>`;

  document.getElementById('pdf-title').textContent = d.doc_id;
  document.getElementById('pdf-sub').textContent = d.total_pages ? `${d.total_pages} 页 · ${(d.chunks||[]).length} 切片` : '';

  renderChunks();

function inFolderId(docId) {
  const it = LIB.all.find(x => x.doc_id === docId);
  return it && it._folder ? it._folder : 'unfiled';
}

function renderPDF() {
  const viewer = document.getElementById('pdf-viewer');
  const images = currentData.page_images || [];
  if (!images.length) { viewer.innerHTML = '<div class="lib-empty">无页面预览</div>'; return; }
  viewer.innerHTML = images.map((img, i) => `
    <div class="pdf-page" id="pdf-page-${i+1}" onclick="scrollToPage(${i+1})">
      <div class="pl"><span>PAGE ${i+1}</span><span>${currentData.total_pages} 页</span></div>
      <img src="${img}" alt="Page ${i+1}" loading="lazy">
    </div>`).join('');
}

/* ═════════════════ 切片渲染 ═════════════════ */
function renderChunks() {
  const list = document.getElementById('chunk-list');
  const chunks = currentData.chunks || [];
  document.getElementById('chunk-info').textContent = chunks.length ? `${chunks.length} 个切片` : '无切片';
  if (!chunks.length) {
    list.innerHTML = '<div class="lib-empty">该文档未生成切片</div>';
    return;
  }
  list.innerHTML = chunks.map((c, i) => renderChunkCard(c, i)).join('');
}

function chunkIcon(level) { return level === 1 ? '📄' : level === 2 ? '📑' : '📝'; }

function renderChunkCard(c, i) {
  const pageStr = c.start_page === c.end_page ? `p${c.start_page}` : `p${c.start_page}–${c.end_page}`;
  const collapsed = c.collapsed ? 'collapsed' : '';
  const editBadge = c.edit_count ? `<span class="edit-badge">✏ ${c.edit_count} · ${c.last_edited||''}</span>` : '';
  const childrenHtml = c.children && c.children.length > 0
    ? `<div class="chunk-children"><div class="child-label">子切片 ${c.children.length}</div>${c.children.map((ch,j)=>renderChunkCard(ch,`${i}-${j}`)).join('')}</div>`
    : '';
  return `<div class="chunk-card level-${c.level} ${collapsed}" data-chunk="${i}">
    <div class="chunk-head" onclick="toggleChunk('${i}')">
      <span class="tic">${chunkIcon(c.level)}</span>
      <span class="title">${escapeHtml(c.title)}</span>
      ${editBadge}
      <span class="pages">${pageStr}</span>
      <span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></span>
    </div>
    <div class="chunk-body-wrap">
      <div class="chunk-content">${(c.elements&&c.elements.length?c.elements.map(renderElement).join(''):(c.content?`<div class="chunk-element paragraph">${escapeHtml(c.content)}</div>`:'<div class="lib-empty">(空)</div>'))}</div>
    </div>
    ${childrenHtml}
    <div class="chunk-actions">
      <button class="act-btn add" onclick="insertChunk('${i}','before')">${IC.plus} 前插</button>
      <button class="act-btn add" onclick="insertChunk('${i}','after')">${IC.plus} 后插</button>
      <button class="act-btn" onclick="editChunk('${i}')">${IC.pen} 编辑</button>
      <button class="act-btn danger" onclick="deleteChunk('${i}')">${IC.trash} 删除</button>
      <button class="act-btn" onclick="locateChunk('${i}')">${IC.move} 定位</button>
    </div>
  </div>`;
}

function renderElement(elem) {
  if (elem.type === 'table') {
    const headers = elem.headers || [];
    const rows = elem.rows || [];
    let html = '<div class="chunk-element table"><table><thead><tr>';
    headers.forEach(h => { html += `<th>${escapeHtml(String(h ?? ''))}</th>`; });
    html += '</tr></thead><tbody>';
    rows.forEach(row => {
      html += '<tr>';
      (Array.isArray(row) ? row : [row]).forEach(cell => html += `<td>${escapeHtml(String(cell ?? ''))}</td>`);
      html += '</tr>';
    });
    return html + '</tbody></table></div>';
  } else if (elem.type === 'image') {
    const cap = elem.caption || '';
    return `<div class="chunk-element image"><img src="${elem.src}" alt="" data-cap="${escapeHtml(cap)}" onclick="openLightbox(this)"/>${cap?`<div class="cap">${escapeHtml(cap)}</div>`:''}</div>`;
  } else {
    return `<div class="chunk-element paragraph">${escapeHtml(elem.text||'')}</div>`;
  }
}

/* ═════════════════ 切片操作 ═════════════════ */
// key 支持 'i'（顶层）或 'i-j'（子切片）
function parseChunkKey(key) {
  const parts = String(key).split('-').map(Number);
  if (parts.length === 1) {
    return { parent: currentData.chunks, idx: parts[0], chunk: currentData.chunks[parts[0]] };
  }
  const parent = currentData.chunks[parts[0]];
  if (!parent || !parent.children) return null;
  return { parent: parent.children, idx: parts[1], chunk: parent.children[parts[1]] };
}

function toggleChunk(key) {
  const el = document.querySelector(`[data-chunk="${key}"]`);
  if (el) el.classList.toggle('collapsed');
}
function locateChunk(key) {
  const r = parseChunkKey(key);
  if (r && r.chunk) scrollToPage(r.chunk.start_page || 1);
}
function scrollToPage(page) {
  const el = document.getElementById(`pdf-page-${page}`);
  if (!el) return;
  document.querySelectorAll('.pdf-page').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function insertChunk(key, where) {
  const r = parseChunkKey(key);
  if (!r) return;
  const newChunk = { id: 'manual-' + Date.now(), level: 2, title: '新切片', content: '', elements: [{type:'paragraph',text:'',y:0}], start_page: 1, end_page: 1, children: [], manual: true };
  const at = where === 'before' ? r.idx : r.idx + 1;
  r.parent.splice(at, 0, newChunk);
  renderChunks();
}
function deleteChunk(key) {
  const r = parseChunkKey(key);
  if (!r || !r.chunk) return;
  const c = r.chunk;
  if (c.children && c.children.length && !confirm('此切片含子切片，确定整体删除？')) return;
  if (!confirm(`确定删除「${c.title}」？`)) return;
  r.parent.splice(r.idx, 1);
  renderChunks();
}

/* 编辑切片（所见即所得） */
function editChunk(key) {
  const r = parseChunkKey(key);
  if (!r) return;
  const c = r.chunk;
  editTarget = r;  // 存 {parent, idx, chunk}
  document.getElementById('edit-level').value = c.level;
  document.getElementById('edit-title').value = c.title;
  const pages = c.start_page === c.end_page ? String(c.start_page) : `${c.start_page}-${c.end_page}`;
  document.getElementById('edit-pages').value = pages;
  renderEditElements(c.elements || []);
  document.getElementById('edit-modal').classList.add('show');
}
function closeEdit() {
  document.getElementById('edit-modal').classList.remove('show');
  editTarget = null;
}
function renderEditElements(elements) {
  const container = document.getElementById('edit-elements');
  container.innerHTML = elements.map((elem, i) => {
    if (elem.type === 'paragraph') {
      return `<div class="edit-elem"><div class="edit-elem-head"><span class="label">📝 段落 ${i+1}</span><button class="act-btn danger" onclick="removeEditElem(this)">${IC.trash}</button></div><div class="edit-elem-body"><textarea data-kind="p">${escapeHtml(elem.text||'')}</textarea></div></div>`;
    } else if (elem.type === 'image') {
      return `<div class="edit-elem"><div class="edit-elem-head"><span class="label">🖼️ 图片 ${i+1}</span><button class="act-btn danger" onclick="removeEditElem(this)">${IC.trash}</button></div><div class="edit-elem-body"><img class="edit-elem-img" src="${elem.src}" data-cap="${escapeHtml(elem.caption||'')}" data-kind="img" onclick="openLightbox(this)"><input class="edit-elem-caption" data-kind="cap" value="${escapeHtml(elem.caption||'')}" placeholder="图注"></div></div>`;
    } else if (elem.type === 'table') {
      const headers = elem.headers || [];
      const rows = elem.rows || [];
      let th = '<div class="edit-elem-head"><span class="label">📊 表格 ' + (i+1) + '</span><button class="act-btn danger" onclick="removeEditElem(this)">' + IC.trash + '</button></div><div class="edit-elem-body" style="overflow-x:auto"><table><thead><tr>';
      headers.forEach(h => th += `<th>${escapeHtml(String(h??''))}</th>`);
      th += '</tr></thead><tbody>';
      rows.forEach(row => {
        th += '<tr>';
        (Array.isArray(row)?row:[row]).forEach(cell => th += `<td>${escapeHtml(String(cell??''))}</td>`);
        th += '</tr>';
      });
      th += '</tbody></table><input type="hidden" data-kind="tbl" value="' + encodeURIComponent(JSON.stringify({headers, rows})) + '"></div>';
      return `<div class="edit-elem">${th}</div>`;
    }
    return '';
  }).join('');
}
function removeEditElem(btn) {
  const card = btn.closest('.edit-elem');
  if (card) card.remove();
}
function addEditParagraph() {
  const container = document.getElementById('edit-elements');
  const div = document.createElement('div');
  div.className = 'edit-elem';
  div.innerHTML = `<div class="edit-elem-head"><span class="label">📝 新段落</span><button class="act-btn danger" onclick="removeEditElem(this)">${IC.trash}</button></div><div class="edit-elem-body"><textarea data-kind="p" placeholder="输入段落文本…"></textarea></div>`;
  container.appendChild(div);
  div.querySelector('textarea').focus();
}
function addEditImage() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  input.onchange = () => {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const container = document.getElementById('edit-elements');
      const div = document.createElement('div');
      div.className = 'edit-elem';
      div.innerHTML = `<div class="edit-elem-head"><span class="label">🖼️ 新图片</span><button class="act-btn danger" onclick="removeEditElem(this)">${IC.trash}</button></div><div class="edit-elem-body"><img class="edit-elem-img" src="${e.target.result}" data-kind="img"><input class="edit-elem-caption" data-kind="cap" placeholder="图注"></div>`;
      container.appendChild(div);
    };
    reader.readAsDataURL(file);
  };
  input.click();
}
function confirmEdit() {
  if (!editTarget) return;
  const c = editTarget.chunk;
  c.level = parseInt(document.getElementById('edit-level').value);
  c.title = document.getElementById('edit-title').value;
  const pages = document.getElementById('edit-pages').value;
  const m = pages.match(/(\d+)(?:-(\d+))?/);
  if (m) { c.start_page = parseInt(m[1]); c.end_page = m[2] ? parseInt(m[2]) : c.start_page; }
  c.manual = true;

  const newElements = [];
  document.querySelectorAll('#edit-elements .edit-elem').forEach(card => {
    const p = card.querySelector('textarea[data-kind="p"]');
    const img = card.querySelector('img[data-kind="img"]');
    const tbl = card.querySelector('input[data-kind="tbl"]');
    if (p) newElements.push({ type:'paragraph', text:p.value, y:0 });
    else if (img) {
      const cap = card.querySelector('input[data-kind="cap"]');
      newElements.push({ type:'image', src:img.src, caption: cap?cap.value:'', y:0 });
    } else if (tbl) {
      try { const t = JSON.parse(decodeURIComponent(tbl.value)); newElements.push({ type:'table', headers:t.headers, rows:t.rows, y:0 }); } catch(e){}
    }
  });
  c.elements = newElements;
  c.content = newElements.filter(e => e.type==='paragraph').map(e => e.text).join('\n\n');
  c.edit_count = (c.edit_count || 0) + 1;
  c.last_edited = new Date().toLocaleString('zh-CN', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  closeEdit();
  renderChunks();
}

/* 重新切片 / 保存 / 导出 */
async function rechunk() {
  if (!currentDoc) return;
  if (!confirm('重新自动切片会丢弃当前手动修改，确定？')) return;
  showToast('重新切片…', true);
  try {
    const res = await fetch(`/api/doc/${currentDoc}?refresh=1`);
    currentData = await res.json();
    hideToast();
    renderWorkspace();
  } catch(e) { hideToast(); alert('失败: ' + e.message); }
}
async function saveChunks() {
  if (!currentDoc || !currentData) return;
  showToast('保存切片…', true);
  try {
    const res = await fetch(`/api/doc/${currentDoc}/chunks`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ chunks: currentData.chunks, total_pages: currentData.total_pages }),
    });
    const r = await res.json();
    if (r.error) throw new Error(r.error);
    hideToast();
    showToast('已保存 ✅', false, 1500);
    // 更新 library 中的 has_save 状态
    await loadLibrary();
  } catch(e) { hideToast(); alert('保存失败: ' + e.message); }
}
function exportJSON() {
  if (!currentData) return;
  const blob = new Blob([JSON.stringify({ doc_id: currentDoc, chunks: currentData.chunks }, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${currentDoc}_chunks.json`;
  a.click();
}

function openPalette() {

function closePalette() {

function onPaletteInput(v) {
  const q = v.trim().toLowerCase();
  paletteResults = [];
  let html = '';
  if (!q) {
    html += '<div class="cmd-group">最近/全部</div>';

    });
    html += '<div class="cmd-group">文件夹</div>';
    LIB.folders.forEach(f => {
      paletteResults.push({ type:'folder', folder: f });
      html += `<div class="cmd-item" data-idx="${paletteResults.length - 1}" onmouseenter="paletteHover(${paletteResults.length - 1})" onclick="openFolderResult('${f.id}')"><span class="ic">${IC.folder}</span><div class="body"><div class="t1">${escapeHtml(f.name)}</div><div class="t2">${f.docs.length} 份文档</div></div><span class="hint">⏎ 打开</span></div>`;
    });
  } else {
    const matched = LIB.all.filter(d => d.doc_id.toLowerCase().includes(q));
    const matchedFolders = LIB.folders.filter(f => f.name.toLowerCase().includes(q));
    if (matched.length || matchedFolders.length) {
      if (matched.length) {
        html += `<div class="cmd-group">文档 (${matched.length})</div>`;
        matched.slice(0, 15).forEach(d => {
          paletteResults.push({ type:'doc', doc: d });
          html += paletteDocItem(d, paletteResults.length - 1);
        });
      }
      if (matchedFolders.length) {
        html += `<div class="cmd-group">文件夹 (${matchedFolders.length})</div>`;
        matchedFolders.slice(0, 10).forEach(f => {
          paletteResults.push({ type:'folder', folder: f });
          html += `<div class="cmd-item" data-idx="${paletteResults.length - 1}" onmouseenter="paletteHover(${paletteResults.length - 1})" onclick="openFolderResult('${f.id}')"><span class="ic">${IC.folder}</span><div class="body"><div class="t1">${escapeHtml(f.name)}</div><div class="t2">${f.docs.length} 份文档</div></div><span class="hint">⏎ 打开</span></div>`;
        });
      }
    } else {
      html = '<div id="cmd-empty">未找到匹配结果</div>';
    }
  }
  paletteSel = -1;
  document.getElementById('cmd-results').innerHTML = html;
}
function paletteDocItem(d, idx) {
  const folderName = d._folder ? (LIB.folders.find(f => f.id === d._folder)?.name || '') : '未归档';
  return `<div class="cmd-item" data-idx="${idx}" onmouseenter="paletteHover(${idx})" onclick="openDoc('${d.doc_id}');closePalette()">
    <span class="ic">${IC.docs}</span>
    <div class="body"><div class="t1">${escapeHtml(d.doc_id)}</div><div class="t2">${escapeHtml(folderName)}</div></div>
    <span class="hint">↵</span>
  </div>`;
}
function paletteHover(i) {
  paletteSel = i;
  document.querySelectorAll('#cmd-results .cmd-item').forEach(el => {
    const idx = parseInt(el.dataset.idx || '-1');
    el.classList.toggle('sel', idx === i);
  });
}
function onPaletteKey(e) {
  if (e.key === 'Escape') { closePalette(); return; }
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    const items = document.querySelectorAll('#cmd-results .cmd-item');
    if (!items.length) return;
    paletteSel = Math.min(paletteSel + 1, items.length - 1);
    paletteHover(paletteSel);
    items[paletteSel]?.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    const items = document.querySelectorAll('#cmd-results .cmd-item');
    if (!items.length) return;
    paletteSel = Math.max(paletteSel - 1, 0);
    paletteHover(paletteSel);
    items[paletteSel]?.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') {
    e.preventDefault();
    const items = document.querySelectorAll('#cmd-results .cmd-item');
    if (paletteSel >= 0 && items[paletteSel]) items[paletteSel].click();
  }
}
function openFolderResult(folderId) {
  closePalette();
  selectFolder(folderId);
}

/* ═════════════════ Toast ═════════════════ */
let toastTimer = null;
function showToast(text, spin = false, ms = 0) {
  const t = document.getElementById('toast');
  t.innerHTML = spin ? `<span class="spinner"></span>` : '';
  t.appendChild(document.createTextNode(text));
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  if (ms) toastTimer = setTimeout(hideToast, ms);
}
function hideToast() { document.getElementById('toast').classList.remove('show'); }

/* ═════════════════ 下拉菜单 ═════════════════ */
function openDropdown(x, y, items) {
  const dd = document.getElementById('dropdown');
  let html = '';
  items.forEach(it => {
    if (it.type === 'sep') { html += '<div class="dd-sep"></div>'; return; }
    html += `<div class="dd-item ${it.danger?'danger':''}" onclick="ddAct(${items.indexOf(it)})">${it.icon||''}${it.label}</div>`;
  });
  dd.innerHTML = html;
  dd.dataset.actions = '';
  dd._actions = items;
  dd.style.left = Math.min(x, window.innerWidth - 210) + 'px';
  dd.style.top = Math.min(y, window.innerHeight - items.length * 34 - 10) + 'px';
  dd.classList.add('show');
  // 点击外部关闭
  setTimeout(() => {
    document.addEventListener('click', closeDropdownOnce, { once: true });
  }, 0);
}
function closeDropdownOnce(e) {
  const dd = document.getElementById('dropdown');
  if (dd.contains(e.target)) return;
  dd.classList.remove('show');
}
function ddAct(i) {
  const dd = document.getElementById('dropdown');
  const items = dd._actions || [];
  dd.classList.remove('show');
  if (items[i] && items[i].action) items[i].action();
}

/* ═════════════════ 分隔条拖拽 ═════════════════ */
function makeResizer(el, target, isLeft) {
  let dragging = false;
  el.addEventListener('mousedown', e => {
    dragging = true;
    el.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const main = document.getElementById('main').getBoundingClientRect();
    if (isLeft) {
      let w = Math.max(220, Math.min(e.clientX - main.left, 560));
      document.getElementById('library').style.width = w + 'px';
      document.getElementById('library').style.flexBasis = w + 'px';
    } else {
      let w = Math.max(240, Math.min(e.clientX - main.left, 9999));
      document.getElementById('pdf-panel').style.flexBasis = w + 'px';
      document.getElementById('pdf-panel').style.flexGrow = '0';
    }
  });
  document.addEventListener('mouseup', () => {
    if (dragging) {
      dragging = false;
      el.classList.remove('dragging');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    }
  });
}
makeResizer(document.getElementById('resizer-lib'), document.getElementById('library'), true);
makeResizer(document.getElementById('resizer-chunk'), document.getElementById('pdf-panel'), false);

/* ═════════════════ 快捷键 & 初始化 ═════════════════ */
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    openPalette();
  }
});

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

initTheme();
initLibraryCollapsed();
setupDragHandlers();
loadLibrary();
</script>
