<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DICE Human Review</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f5;color:#333;height:100vh;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh}

/* Top bar */
.topbar{background:#fff;border-bottom:1px solid #e0e0e0;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar .title{font-size:15px;font-weight:600;color:#555}
.topbar .progress{font-size:14px;color:#888;min-width:80px;text-align:center}
.topbar .actions{display:flex;gap:8px}
.btn-sm{padding:5px 14px;border:1px solid #ddd;border-radius:6px;background:#fff;font-size:13px;cursor:pointer;color:#555}
.btn-sm:hover{background:#f0f0f0}
.btn-sm.primary{background:#4a90d9;color:#fff;border-color:#4a90d9}
.btn-sm.primary:hover{background:#3a80c9}

/* Main split */
.main{display:flex;flex:1;overflow:hidden}

/* Document area */
.doc-area{flex:1;background:#e8e8e8;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;position:relative}
.doc-frame{position:relative;display:inline-block}
.doc-frame img{display:block;max-width:100%;height:auto;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.highlight-box{position:absolute;border:3px solid #e74c3c;border-radius:2px;pointer-events:none;box-shadow:0 0 0 2px rgba(231,76,60,.2);transition:all .2s}
.highlight-box::after{content:attr(data-label);position:absolute;top:-22px;left:-3px;background:#e74c3c;color:#fff;font-size:11px;padding:2px 8px;border-radius:3px;white-space:nowrap}

/* Review panel — width controlled by --review-w (draggable splitter) */
.review-panel{width:var(--review-w,420px);background:#fff;border-left:none;display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}

/* Splitter — draggable divider between document and review panel */
.splitter{width:6px;flex-shrink:0;background:#e0e0e0;cursor:col-resize;position:relative;transition:background .15s;z-index:10}
.splitter:hover,.splitter.dragging{background:#4a90d9}
.splitter::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:3px;height:36px;border-radius:3px;background:#bbb;transition:background .15s}
.splitter:hover::after,.splitter.dragging::after{background:#fff}

/* System suggestion */
.suggestion{padding:20px;border-bottom:1px solid #f0f0f0}
.suggestion-label{font-size:12px;color:#999;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.suggestion-text{font-size:17px;line-height:1.5;color:#333;font-weight:500}
.suggestion-confidence{font-size:13px;color:#888;margin-top:8px}
.reasoning{font-size:13px;color:#777;line-height:1.5;margin-top:12px;padding:10px;background:#fafafa;border-radius:6px}
.alternatives{margin-top:10px;font-size:13px;color:#666}
.alternatives .alt-item{padding:3px 0}
.alternatives .alt-label{color:#999;font-size:12px;margin-right:4px}
.disclaimer{font-size:11px;color:#bbb;margin-top:12px;line-height:1.4}

/* Candidate info */
.candidate-info{padding:12px 20px;border-bottom:1px solid #f0f0f0;background:#fcfcfc}
.candidate-text{font-size:15px;color:#444;font-style:italic}
.candidate-meta{font-size:12px;color:#aaa;margin-top:4px}

/* Decision buttons */
.decision-area{padding:20px;border-bottom:1px solid #f0f0f0}
.decision-label{font-size:12px;color:#999;margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px}
.decision-buttons{display:flex;gap:10px}
.dec-btn{flex:1;padding:16px 8px;border:2px solid #e0e0e0;border-radius:10px;background:#fff;font-size:15px;cursor:pointer;text-align:center;transition:all .15s;font-weight:500}
.dec-btn:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.1)}
.dec-btn.accept{border-color:#27ae60;color:#27ae60}
.dec-btn.accept:hover{background:#27ae60;color:#fff}
.dec-btn.reject{border-color:#e74c3c;color:#e74c3c}
.dec-btn.reject:hover{background:#e74c3c;color:#fff}
.dec-btn.uncertain{border-color:#f39c12;color:#f39c12}
.dec-btn.uncertain:hover{background:#f39c12;color:#fff}
.dec-btn .icon{font-size:22px;display:block;margin-bottom:2px}
.dec-btn .label{font-size:14px}

/* Judged button states */
.dec-btn.judged{opacity:.45;filter:grayscale(.3)}
.dec-btn.judged-selected{opacity:1;filter:none;box-shadow:0 0 0 3px rgba(0,0,0,.15)}
.dec-btn.accept.judged-selected{background:#27ae60;color:#fff;border-color:#27ae60}
.dec-btn.reject.judged-selected{background:#e74c3c;color:#fff;border-color:#e74c3c}
.dec-btn.uncertain.judged-selected{background:#f39c12;color:#fff;border-color:#f39c12}
.judged-status{margin-top:10px;font-size:13px;color:#888;display:none}
.judged-status.show{display:block}
.judged-status .badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:12px;font-weight:600;margin-right:6px}
.judged-status .badge.accept{background:#27ae60;color:#fff}
.judged-status .badge.reject{background:#e74c3c;color:#fff}
.judged-status .badge.uncertain{background:#f39c12;color:#fff}

/* Feedback area */
.feedback{padding:20px;border-bottom:1px solid #f0f0f0}
.feedback-label{font-size:12px;color:#999;margin-bottom:8px}
.feedback-hint{font-size:13px;color:#aaa;margin-bottom:10px}
.feedback-textarea{width:100%;min-height:60px;padding:10px;border:1px solid #e0e0e0;border-radius:6px;font-size:14px;resize:vertical;font-family:inherit;outline:none}
.feedback-textarea:focus{border-color:#4a90d9}
.mic-row{display:flex;align-items:center;gap:10px;margin-top:10px}
.mic-btn{width:44px;height:44px;border-radius:50%;border:2px solid #e0e0e0;background:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.mic-btn:hover{border-color:#4a90d9}
.mic-btn.recording{border-color:#e74c3c;background:#e74c3c;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.mic-status{font-size:13px;color:#888}
.mic-status.recording{color:#e74c3c}
.mic-status.transcribing{color:#f39c12}

/* Navigation */
.nav-area{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.nav-btn{padding:8px 18px;border:1px solid #ddd;border-radius:6px;background:#fff;font-size:14px;cursor:pointer;color:#555}
.nav-btn:hover{background:#f0f0f0}
.nav-btn:disabled{opacity:.4;cursor:not-allowed}

/* Done screen */
.done-screen{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}
.done-screen.show{display:flex}
.done-icon{font-size:60px;margin-bottom:20px}
.done-title{font-size:24px;font-weight:600;margin-bottom:10px}
.done-stats{font-size:16px;color:#666;margin-bottom:30px;line-height:2}
.done-actions{display:flex;gap:12px}

/* Hidden */
.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
  <!-- Top bar -->
  <div class="topbar">
    <div class="title">DICE Human Review</div>
    <div class="progress" id="progress">— / 33</div>
    <div class="actions">
      <button class="btn-sm" id="btn-export" onclick="exportData()">导出</button>
      <button class="btn-sm primary" id="btn-save" onclick="saveDraft()">保存</button>
    </div>
  </div>

  <!-- Main split -->
  <div class="main" id="main-area">
    <!-- A. Document area -->
    <div class="doc-area" id="doc-area">
      <div class="doc-frame" id="doc-frame">
        <img id="page-img" src="" alt="page" onload="onImageLoad()" />
        <div class="highlight-box" id="highlight" data-label=""></div>
      </div>
    </div>

    <!-- Draggable splitter -->
    <div class="splitter" id="splitter" title="拖动调整左右宽度"></div>

    <!-- Review panel -->
    <div class="review-panel" id="review-panel">
      <!-- B. System suggestion -->
      <div class="suggestion">
        <div class="suggestion-label">系统建议</div>
        <div class="suggestion-text" id="suggestion-text"></div>
        <div class="suggestion-confidence" id="suggestion-confidence"></div>
        <div class="reasoning" id="reasoning"></div>
        <div class="alternatives" id="alternatives"></div>
        <div class="disclaimer">这是系统建议，不是最终事实。你拥有最终决定权。</div>
      </div>

      <!-- Candidate info (minimal) -->
      <div class="candidate-info">
        <div class="candidate-text" id="candidate-text"></div>
        <div class="candidate-meta" id="candidate-meta"></div>
      </div>

      <!-- C. Decision area -->
      <div class="decision-area">
        <div class="decision-label" id="decision-label">你的判断</div>
        <div class="decision-buttons">
          <button class="dec-btn accept" id="btn-accept" onclick="submitDecision('accept')">
            <span class="icon">✓</span><span class="label">对</span>
          </button>
          <button class="dec-btn reject" id="btn-reject" onclick="submitDecision('reject')">
            <span class="icon">✕</span><span class="label">不对</span>
          </button>
          <button class="dec-btn uncertain" id="btn-need-review" onclick="submitDecision('need_review')">
            <span class="icon">?</span><span class="label">无法确定</span>
          </button>
        </div>
        <div class="judged-status" id="judged-status"></div>
      </div>

      <!-- D. Feedback area -->
      <div class="feedback">
        <div class="feedback-label">补充说明（可选）</div>
        <div class="feedback-hint">如果你认为系统判断不对，可以补充原因</div>
        <textarea class="feedback-textarea" id="reviewer-note"
          placeholder="输入文字说明，或点击麦克风语音输入…"
          oninput="onNoteInput()"></textarea>
        <div class="mic-row">
          <button class="mic-btn" id="mic-btn" onclick="toggleMic()" title="点击开始录音，再次点击停止">🎤</button>
          <span class="mic-status" id="mic-status"></span>
        </div>
      </div>

      <!-- Navigation -->
      <div class="nav-area">
        <button class="nav-btn" id="btn-prev" onclick="goPrev()">← 上一条</button>
        <button class="nav-btn" id="btn-next" onclick="goNext()">下一条 →</button>
      </div>
    </div>
  </div>

  <!-- Done screen -->
  <div class="done-screen" id="done-screen">
    <div class="done-icon">✅</div>
    <div class="done-title">审阅完成</div>
    <div class="done-stats" id="done-stats"></div>
    <div class="done-actions">
      <button class="btn-sm" onclick="location.reload()">重新审阅</button>
      <button class="btn-sm primary" onclick="exportData()">导出结果</button>
    </div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let candidates = [];
let currentIdx = 0;
let displayTime = 0;        // when current candidate was shown (for duration)
let decisions = {};          // {observation_id: {decision, reviewer_note, duration_seconds, submitted}}
let speechRec = null;
let isRecording = false;

const STORAGE_KEY = "p7_2_review_draft";

// ── Init ────────────────────────────────────────────────────────────────────
async function init() {
  // Load candidates from server
  const resp = await fetch("/api/candidates");
  const data = await resp.json();
  candidates = data.candidates;

  // Restore from localStorage
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      decisions = parsed.decisions || {};
      currentIdx = Math.min(parsed.currentIdx || 0, candidates.length - 1);
    } catch(e) { /* ignore corrupt */ }
  }

  // Setup speech recognition (graceful degradation)
  setupSpeech();

  // Load page image
  document.getElementById("page-img").src = "/api/page-image";

  // Restore panel width preference
  const savedW = localStorage.getItem("p7_2_review_panel_w");
  if (savedW) setPanelWidth(parseInt(savedW));

  // Setup draggable splitter
  setupSplitter();

  renderCandidate();
}

// ── Speech Recognition (click-to-start, click-to-stop) ──────────────────────
function setupSpeech() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micBtn = document.getElementById("mic-btn");
  if (!SR) {
    // Graceful degradation: hide mic, keep textarea
    micBtn.classList.add("hidden");
    document.getElementById("mic-status").textContent = "";
    return;
  }
  speechRec = new SR();
  speechRec.lang = "zh-CN";
  speechRec.continuous = false;
  speechRec.interimResults = false;

  speechRec.onresult = function(e) {
    const transcript = e.results[0][0].transcript;
    const ta = document.getElementById("reviewer-note");
    const existing = ta.value.trim();
    ta.value = existing ? existing + " " + transcript : transcript;
    onNoteInput();
  };
  speechRec.onerror = function(e) {
    document.getElementById("mic-status").textContent = "录音出错，请改用文字输入";
    document.getElementById("mic-status").className = "mic-status";
    resetMicBtn();
  };
  speechRec.onend = function() {
    if (isRecording) {
      // Transcribing done
      document.getElementById("mic-status").textContent = "语音转文字完成";
      document.getElementById("mic-status").className = "mic-status";
      resetMicBtn();
    }
  };
}

function toggleMic() {
  if (!speechRec) return;  // not supported, textarea is fallback
  if (isRecording) {
    // Stop
    speechRec.stop();
    isRecording = false;
    document.getElementById("mic-status").textContent = "正在进行语音转文字…";
    document.getElementById("mic-status").className = "mic-status transcribing";
    document.getElementById("mic-btn").textContent = "⏳";
  } else {
    // Start
    try {
      speechRec.start();
      isRecording = true;
      document.getElementById("mic-status").textContent = "正在录音…";
      document.getElementById("mic-status").className = "mic-status recording";
      document.getElementById("mic-btn").textContent = "🔴";
      document.getElementById("mic-btn").classList.add("recording");
    } catch(e) {
      document.getElementById("mic-status").textContent = "无法启动录音";
      resetMicBtn();
    }
  }
}

function resetMicBtn() {
  isRecording = false;
  const btn = document.getElementById("mic-btn");
  btn.textContent = "🎤";
  btn.classList.remove("recording");
}

// ── Render ──────────────────────────────────────────────────────────────────
function renderCandidate() {
  if (currentIdx >= candidates.length) {
    showDone();
    return;
  }
  const c = candidates[currentIdx];

  // Progress
  document.getElementById("progress").textContent = `${currentIdx + 1} / ${candidates.length}`;

  // Suggestion
  document.getElementById("suggestion-text").textContent = c.suggestion_text;
  document.getElementById("suggestion-confidence").textContent = c.confidence_display;
  document.getElementById("reasoning").textContent = c.reasoning_text;

  // Alternatives
  const altDiv = document.getElementById("alternatives");
  if (c.alternatives && c.alternatives.length > 0) {
    let html = '<div class="alt-label">可能是：</div>';
    c.alternatives.forEach((a, i) => {
      html += `<div class="alt-item"><span class="alt-label">${String.fromCharCode(65+i)}.</span> ${a}</div>`;
    });
    html += '<div class="alt-item" style="margin-top:4px;color:#999">请判断。</div>';
    altDiv.innerHTML = html;
  } else {
    altDiv.innerHTML = "";
  }

  // Candidate info
  document.getElementById("candidate-text").textContent = `"${c.candidate_text}"`;
  document.getElementById("candidate-meta").textContent = `第 ${c.page_number} 页`;

  // Feedback
  const note = document.getElementById("reviewer-note");
  const existing = decisions[c.observation_id];
  note.value = (existing && existing.reviewer_note) || "";

  // Update decision button visual state (show previous judgment)
  updateDecisionButtons(existing);

  // Highlight box position (set after image loads)
  updateHighlight(c);

  // Reset display time for duration measurement
  displayTime = Date.now();

  // Nav buttons
  document.getElementById("btn-prev").disabled = currentIdx === 0;
  document.getElementById("btn-next").textContent =
    currentIdx === candidates.length - 1 ? "完成 →" : "下一条 →";
}

function updateDecisionButtons(existing) {
  const btns = ["btn-accept", "btn-reject", "btn-need-review"];
  const decMap = {"accept": "btn-accept", "reject": "btn-reject", "need_review": "btn-need-review"};
  const labelMap = {"accept": "对", "reject": "不对", "need_review": "无法确定"};
  const badgeMap = {"accept": "accept", "reject": "reject", "need_review": "uncertain"};
  const statusDiv = document.getElementById("judged-status");

  // Reset all buttons
  btns.forEach(id => {
    const b = document.getElementById(id);
    b.classList.remove("judged", "judged-selected");
  });

  if (existing && existing.decision) {
    // Mark the selected button
    const selectedId = decMap[existing.decision];
    document.getElementById(selectedId).classList.add("judged-selected");
    // Dim the other buttons
    btns.forEach(id => {
      if (id !== selectedId) {
        document.getElementById(id).classList.add("judged");
      }
    });
    // Show judgment status badge
    const note = existing.reviewer_note ? ` — "${existing.reviewer_note.substring(0, 40)}${existing.reviewer_note.length > 40 ? '…' : ''}"` : "";
    statusDiv.innerHTML = `<span class="badge ${badgeMap[existing.decision]}">${labelMap[existing.decision]}</span>已判断${note}`;
    statusDiv.classList.add("show");
  } else {
    statusDiv.classList.remove("show");
    statusDiv.innerHTML = "";
  }
}

function onImageLoad() {
  if (candidates.length > 0) {
    updateHighlight(candidates[currentIdx]);
  }
}

function updateHighlight(c) {
  const img = document.getElementById("page-img");
  const hl = document.getElementById("highlight");
  if (!img.naturalWidth) return;

  // Scale bbox from PDF coords to image display coords
  const scale = img.clientWidth / c.page_width;
  const b = c.bbox;
  hl.style.left = (b[0] * scale) + "px";
  hl.style.top = (b[1] * scale) + "px";
  hl.style.width = ((b[2] - b[0]) * scale) + "px";
  hl.style.height = ((b[3] - b[1]) * scale) + "px";
  hl.setAttribute("data-label", `候选 ${currentIdx + 1}`);
}

// ── Splitter (draggable panel resize) ───────────────────────────────────────
function setPanelWidth(w) {
  // Clamp: min 280px, max 70% of window
  const maxW = Math.floor(window.innerWidth * 0.7);
  w = Math.max(280, Math.min(w, maxW));
  document.documentElement.style.setProperty("--review-w", w + "px");
}

function setupSplitter() {
  const splitter = document.getElementById("splitter");
  let dragging = false;

  splitter.addEventListener("mousedown", function(e) {
    dragging = true;
    splitter.classList.add("dragging");
    document.body.style.cursor = "col-resize";
    document.body.style.userSelect = "none";
    e.preventDefault();
  });

  document.addEventListener("mousemove", function(e) {
    if (!dragging) return;
    // Review panel is on the right; its width = window width - mouse X
    const w = window.innerWidth - e.clientX;
    setPanelWidth(w);
    // Reposition highlight box live during drag
    if (candidates.length > 0) {
      updateHighlight(candidates[currentIdx]);
    }
  });

  document.addEventListener("mouseup", function() {
    if (!dragging) return;
    dragging = false;
    splitter.classList.remove("dragging");
    document.body.style.cursor = "";
    document.body.style.userSelect = "";
    // Persist preference
    const cur = getComputedStyle(document.documentElement).getPropertyValue("--review-w");
    localStorage.setItem("p7_2_review_panel_w", parseInt(cur) || 420);
    // Final highlight reposition
    if (candidates.length > 0) {
      updateHighlight(candidates[currentIdx]);
    }
  });

  // Double-click to reset to default
  splitter.addEventListener("dblclick", function() {
    setPanelWidth(420);
    localStorage.setItem("p7_2_review_panel_w", 420);
    if (candidates.length > 0) updateHighlight(candidates[currentIdx]);
  });

  // Reposition highlight on window resize
  window.addEventListener("resize", function() {
    if (candidates.length > 0) updateHighlight(candidates[currentIdx]);
  });
}

// ── Decision ────────────────────────────────────────────────────────────────
async function submitDecision(decision) {
  if (currentIdx >= candidates.length) return;
  const c = candidates[currentIdx];
  
  // Prevent duplicate submission: if already judged with same decision, just advance
  const existing = decisions[c.observation_id];
  if (existing && existing.decision === decision && existing.submitted) {
    goNext();
    return;
  }
  
  // If changing decision, confirm
  if (existing && existing.decision && existing.decision !== decision) {
    const labelMap = {"accept": "对", "reject": "不对", "need_review": "无法确定"};
    if (!confirm(`你之前判断的是「${labelMap[existing.decision]}」，要改为「${labelMap[decision]}」吗？`)) {
      return;
    }
  }
  
  const note = document.getElementById("reviewer-note").value.trim();
  const duration = (Date.now() - displayTime) / 1000;

  // Save locally
  decisions[c.observation_id] = {
    decision: decision,
    reviewer_note: note,
    duration_seconds: duration,
    submitted: false,
    timestamp: new Date().toISOString(),
  };
  saveDraft();

  // Update button visual state immediately
  updateDecisionButtons(decisions[c.observation_id]);

  // Submit to server (creates ValidationRecord via existing backend)
  try {
    const resp = await fetch("/api/submit", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        observation_id: c.observation_id,
        decision: decision,
        reviewer_note: note,
        duration_seconds: duration,
      }),
    });
    const result = await resp.json();
    if (result.ok) {
      decisions[c.observation_id].submitted = true;
      decisions[c.observation_id].validation_id = result.validation_id;
      decisions[c.observation_id].evidence_derived = result.evidence_derived;
      saveDraft();
    }
  } catch(e) {
    // Will be submitted on next save/export
  }

  // Auto-advance
  goNext();
}

// ── Navigation ──────────────────────────────────────────────────────────────
function goNext() {
  if (currentIdx < candidates.length - 1) {
    currentIdx++;
    renderCandidate();
  } else {
    showDone();
  }
}

function goPrev() {
  if (currentIdx > 0) {
    currentIdx--;
    renderCandidate();
  }
}

// ── Feedback ────────────────────────────────────────────────────────────────
function onNoteInput() {
  if (currentIdx < candidates.length) {
    const c = candidates[currentIdx];
    if (decisions[c.observation_id]) {
      decisions[c.observation_id].reviewer_note = document.getElementById("reviewer-note").value.trim();
    }
  }
}

// ── Persistence ─────────────────────────────────────────────────────────────
function saveDraft() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    currentIdx: currentIdx,
    decisions: decisions,
  }));
}

async function exportData() {
  const resp = await fetch("/api/export");
  const data = await resp.json();
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "p7_2_validation_export.json";
  a.click();
  URL.revokeObjectURL(url);
}

// ── Done ────────────────────────────────────────────────────────────────────
function showDone() {
  document.getElementById("main-area").classList.add("hidden");
  document.getElementById("done-screen").classList.add("show");
  const accept = Object.values(decisions).filter(d => d.decision === "accept").length;
  const reject = Object.values(decisions).filter(d => d.decision === "reject").length;
  const uncertain = Object.values(decisions).filter(d => d.decision === "need_review").length;
  document.getElementById("done-stats").innerHTML =
    `已完成：${Object.keys(decisions).length} / 33<br>` +
    `✓ 对：${accept}<br>` +
    `✕ 不对：${reject}<br>` +
    `? 无法确定：${uncertain}`;
}

// ── Start ───────────────────────────────────────────────────────────────────
init();
</script>
