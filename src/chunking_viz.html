<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DICE 2.0 · 切片工程可视化</title>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #232733;
  --border: #2e3340;
  --text: #e4e6eb;
  --text-dim: #8b8f9a;
  --accent: #5b9fff;
  --green: #4ade80;
  --red: #f87171;
  --yellow: #fbbf24;
  --orange: #fb923c;
  --purple: #c084fc;
  --tier1: #4ade80;
  --tier2: #fbbf24;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  display: flex; height: 100vh; overflow: hidden;
}

/* ── 左侧文档列表 ── */
#sidebar {
  width: 280px; min-width: 280px;
  background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
#sidebar-header {
  padding: 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
}
#sidebar-header h1 { font-size: 14px; font-weight: 600; color: var(--accent); }
#sidebar-header .badge {
  font-size: 11px; padding: 2px 8px; border-radius: 10px;
  background: var(--surface2); color: var(--text-dim);
}
#search-box {
  padding: 8px 12px; border-bottom: 1px solid var(--border);
}
#search-box input {
  width: 100%; padding: 6px 10px; border-radius: 6px;
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); font-size: 13px; outline: none;
}
#search-box input:focus { border-color: var(--accent); }
#filter-bar {
  padding: 6px 12px; border-bottom: 1px solid var(--border);
  display: flex; gap: 6px; flex-wrap: wrap;
}
.filter-btn {
  font-size: 11px; padding: 3px 8px; border-radius: 4px; cursor: pointer;
  background: var(--surface2); border: 1px solid var(--border); color: var(--text-dim);
  transition: all .15s;
}
.filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.filter-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }
#doc-list {
  flex: 1; overflow-y: auto; padding: 4px;
}
.doc-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: 6px; cursor: pointer;
  transition: background .15s; margin-bottom: 2px;
}
.doc-item:hover { background: var(--surface2); }
.doc-item.active { background: var(--surface2); border-left: 3px solid var(--accent); padding-left: 9px; }
.doc-item .icon { font-size: 18px; flex-shrink: 0; }
.doc-item .info { flex: 1; min-width: 0; }
.doc-item .name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.doc-item .meta { font-size: 11px; color: var(--text-dim); display: flex; gap: 8px; }
.doc-item .meta .prob { color: var(--red); }
.doc-item .meta .ok { color: var(--green); }

/* ── 主内容区 ── */
#main { flex: 1; overflow-y: auto; padding: 24px 32px; }
#main.empty { display: flex; align-items: center; justify-content: center; }
#main.empty .placeholder { text-align: center; color: var(--text-dim); }
#main.empty .placeholder .big { font-size: 48px; margin-bottom: 12px; }

/* ── 文档头部 ── */
.doc-header {
  display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
  padding-bottom: 16px; border-bottom: 1px solid var(--border);
}
.doc-header .icon { font-size: 32px; }
.doc-header .title { flex: 1; }
.doc-header .title h2 { font-size: 20px; font-weight: 600; }
.doc-header .title .sub { font-size: 13px; color: var(--text-dim); margin-top: 2px; }
.doc-header .stats { display: flex; gap: 16px; }
.doc-header .stat {
  text-align: center; padding: 8px 14px; border-radius: 8px;
  background: var(--surface); border: 1px solid var(--border);
}
.doc-header .stat .val { font-size: 18px; font-weight: 700; }
.doc-header .stat .lbl { font-size: 11px; color: var(--text-dim); }
.doc-header .stat .val.green { color: var(--green); }
.doc-header .stat .val.red { color: var(--red); }
.doc-header .stat .val.yellow { color: var(--yellow); }

/* ── 页面卡片 ── */
.section-title {
  font-size: 14px; font-weight: 600; color: var(--text-dim);
  margin: 24px 0 12px; display: flex; align-items: center; gap: 8px;
}
.section-title .count { font-size: 12px; color: var(--text-dim); }

.pages-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.page-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 14px; transition: all .2s; cursor: pointer;
}
.page-card.selected { border-color: var(--green); border-width: 2px; }
.page-card.not-selected { opacity: 0.5; border-style: dashed; }
.page-card:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,0,0,.3); }
.page-card .page-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.page-card .page-num { font-size: 13px; font-weight: 600; color: var(--accent); }
.page-card .page-status { font-size: 18px; }
.page-card .page-score {
  font-size: 11px; padding: 2px 6px; border-radius: 4px;
  background: var(--surface2); color: var(--text-dim);
}
.page-card .page-score.high { color: var(--green); }
.page-card .page-score.mid { color: var(--yellow); }
.page-card .page-preview {
  font-size: 11px; color: var(--text-dim); line-height: 1.5;
  max-height: 60px; overflow: hidden; margin-bottom: 8px;
  font-family: "SF Mono", monospace; white-space: pre-wrap; word-break: break-all;
}
.signal-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.sig-tag {
  font-size: 10px; padding: 2px 6px; border-radius: 3px;
  font-family: monospace;
}
.sig-tag.t1 { background: rgba(74,222,128,.15); color: var(--tier1); border: 1px solid rgba(74,222,128,.3); }
.sig-tag.t2 { background: rgba(251,191,36,.12); color: var(--tier2); border: 1px solid rgba(251,191,36,.25); }

/* ── 字段表 ── */
.field-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.field-table th {
  text-align: left; padding: 8px 12px; color: var(--text-dim); font-weight: 500;
  border-bottom: 1px solid var(--border); font-size: 12px;
}
.field-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); }
.field-table tr:hover { background: var(--surface); }
.field-table .kind-icon { font-size: 14px; }
.field-table .cov-bar {
  display: inline-block; width: 60px; height: 6px; border-radius: 3px;
  background: var(--surface2); margin-right: 6px; vertical-align: middle;
}
.field-table .cov-fill { height: 100%; border-radius: 3px; }
.field-table .cov-val { font-size: 12px; font-family: monospace; }
.cov-fill.good { background: var(--green); }
.cov-fill.warn { background: var(--yellow); }
.cov-fill.bad { background: var(--red); }
.field-table .page-link { color: var(--accent); font-family: monospace; font-size: 12px; }
.field-table .page-link.missing { color: var(--red); }

/* ── 问题面板 ── */
.problem-banner {
  background: rgba(248,113,113,.1); border: 1px solid rgba(248,113,113,.3);
  border-radius: 8px; padding: 12px 16px; margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}
.problem-banner .icon { font-size: 20px; }
.problem-banner .text { font-size: 13px; }
.problem-banner .text b { color: var(--red); }

.ok-banner {
  background: rgba(74,222,128,.1); border: 1px solid rgba(74,222,128,.3);
  border-radius: 8px; padding: 12px 16px; margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}
.ok-banner .icon { font-size: 20px; }
.ok-banner .text { font-size: 13px; color: var(--green); }

/* ── 滚动条 ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
</style>
</head>
<body>
<div id="sidebar">
  <div id="sidebar-header">
    <h1>🔬 切片工程可视化</h1>
    <span class="badge" id="doc-count">0</span>
  </div>
  <div id="search-box"><input type="text" id="search" placeholder="搜索文档..." /></div>
  <div id="filter-bar">
    <span class="filter-btn active" data-filter="all">全部</span>
    <span class="filter-btn" data-filter="datasheet">🧪 Datasheet</span>
    <span class="filter-btn" data-filter="paper">📄 论文</span>
    <span class="filter-btn" data-filter="problem">⚠️ 有问题</span>
  </div>
  <div id="doc-list"></div>
</div>
<div id="main" class="empty">
  <div class="placeholder">
    <div class="big">🔬</div>
    <div>从左侧选择文档查看切片详情</div>
  </div>
</div>
<script src="chunking_viz_data.js"></script>
<script>
const DATA = typeof CHUNKING_VIZ_DATA !== 'undefined' ? CHUNKING_VIZ_DATA : [];
let currentDoc = null;
let currentFilter = 'all';

const KIND_ICONS = { storage: '🌡️', component: '🧬', spec: '📏' };
const TYPE_ICONS = { datasheet: '🧪', paper: '📄' };

function renderDocList() {
  const list = document.getElementById('doc-list');
  const search = document.getElementById('search').value.toLowerCase();
  document.getElementById('doc-count').textContent = DATA.length;

  const filtered = DATA.filter(d => {
    if (search && !d.document_id.toLowerCase().includes(search)) return false;
    if (currentFilter === 'datasheet' && d.doc_type !== 'datasheet') return false;
    if (currentFilter === 'paper' && d.doc_type !== 'paper') return false;
    if (currentFilter === 'problem' && d.problem_count === 0) return false;
    return true;
  });

  list.innerHTML = filtered.map(d => {
    const active = currentDoc === d.document_id ? 'active' : '';
    const probTag = d.problem_count > 0
      ? `<span class="prob">⚠️${d.problem_count}</span>`
      : `<span class="ok">✅</span>`;
    const arxivTag = d.is_arxiv ? '<span>📄</span>' : '<span>🧪</span>';
    return `<div class="doc-item ${active}" onclick="selectDoc('${d.document_id}')">
      <span class="icon">${d.icon}</span>
      <div class="info">
        <div class="name">${d.document_id}</div>
        <div class="meta">
          <span>${d.total_pages}页</span>
          <span>选${d.selected_count}</span>
          ${probTag}
        </div>
      </div>
    </div>`;
  }).join('');
}

function selectDoc(docId) {
  currentDoc = docId;
  renderDocList();
  const doc = DATA.find(d => d.document_id === docId);
  if (!doc) return;
  renderDoc(doc);
}

function scoreClass(score) {
  if (score >= 8) return 'high';
  if (score >= 3) return 'mid';
  return '';
}

function covClass(cov) {
  if (cov >= 0.8) return 'good';
  if (cov >= 0.5) return 'warn';
  return 'bad';
}

function renderDoc(doc) {
  const main = document.getElementById('main');
  main.classList.remove('empty');

  const hasProblems = doc.problem_count > 0;
  const banner = hasProblems
    ? `<div class="problem-banner"><span class="icon">⚠️</span><span class="text">发现 <b>${doc.problem_count}</b> 个字段覆盖率不足 80%，可能需要调整切片策略</span></div>`
    : `<div class="ok-banner"><span class="icon">✅</span><span class="text">所有字段覆盖率 ≥ 80%，切片质量良好</span></div>`;

  const truncTag = doc.truncated ? '<span style="color:var(--yellow)">📏 接近截断</span>' : '';
  const typeLabel = doc.doc_type === 'datasheet' ? 'Datasheet（试剂盒说明书）' : '学术论文（非 Datasheet）';
  const typeBehavior = doc.doc_type === 'datasheet'
    ? `<span style="color:var(--green)">→ 评分选页</span>`
    : `<span style="color:var(--accent)">→ 退回前几页</span>`;

  // 页面卡片
  const pagesHtml = doc.pages.map(p => {
    const selClass = p.selected ? 'selected' : 'not-selected';
    const selIcon = p.selected ? '✅' : '⬜';
    const t1Tags = (p.tier1_hits || []).map(w => `<span class="sig-tag t1">${w}</span>`).join('');
    const t2Tags = (p.tier2_hits || []).map(w => `<span class="sig-tag t2">${w}</span>`).join('');
    return `<div class="page-card ${selClass}" onclick="togglePage(${p.page})">
      <div class="page-head">
        <span class="page-num">📄 Page ${p.page}</span>
        <span class="page-status">${selIcon}</span>
        <span class="page-score ${scoreClass(p.score)}">score: ${p.score}</span>
      </div>
      <div class="page-preview">${escapeHtml(p.preview)}</div>
      <div class="signal-tags">${t1Tags}${t2Tags}</div>
    </div>`;
  }).join('');

  // 字段表
  let fieldsHtml = '';
  if (doc.fields && doc.fields.length > 0) {
    fieldsHtml = `<div class="section-title">📋 字段覆盖率 <span class="count">(${doc.fields.length} 个字段)</span></div>
    <table class="field-table">
      <thead><tr><th></th><th>字段</th><th>source_quote</th><th>覆盖率</th><th>来源页</th><th>在选中页?</th></tr></thead>
      <tbody>
      ${doc.fields.map(f => {
        const cov = f.coverage;
        const covPct = Math.round(cov * 100);
        const covC = covClass(cov);
        const pageTag = f.source_page !== null
          ? `<span class="page-link ${f.on_selected_page ? '' : 'missing'}">p${f.source_page}</span>`
          : '<span class="page-link missing">未找到</span>';
        const onSel = f.on_selected_page === true ? '✅'
          : f.on_selected_page === false ? '❌' : '—';
        return `<tr>
          <td class="kind-icon">${KIND_ICONS[f.kind] || '❓'}</td>
          <td>${escapeHtml(f.text.substring(0, 40))}</td>
          <td style="font-size:11px;color:var(--text-dim);max-width:200px;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(f.source_quote.substring(0, 40))}</td>
          <td><span class="cov-bar"><span class="cov-fill ${covC}" style="width:${covPct}%"></span></span><span class="cov-val">${covPct}%</span></td>
          <td>${pageTag}</td>
          <td>${onSel}</td>
        </tr>`;
      }).join('')}
      </tbody>
    </table>`;
  }

  main.innerHTML = `
    <div class="doc-header">
      <span class="icon">${doc.icon}</span>
      <div class="title">
        <h2>${doc.document_id}</h2>
        <div class="sub">${typeLabel} ${typeBehavior} · ${doc.total_pages} 页 · 选 ${doc.selected_count} 页 · ctx ${doc.context_length} 字符 ${truncTag}</div>
      </div>
      <div class="stats">
        <div class="stat"><div class="val ${doc.field_count > 0 ? 'green' : ''}">${doc.field_count}</div><div class="lbl">字段</div></div>
        <div class="stat"><div class="val ${doc.problem_count > 0 ? 'red' : 'green'}">${doc.problem_count}</div><div class="lbl">问题</div></div>
        <div class="stat"><div class="val">${doc.selected_count}/${doc.total_pages}</div><div class="lbl">选中页</div></div>
      </div>
    </div>
    ${banner}
    <div class="section-title">📄 页面切片详情 <span class="count">(${doc.total_pages} 页, 选 ${doc.selected_count})</span></div>
    <div class="pages-grid">${pagesHtml}</div>
    ${fieldsHtml}
  `;
}

function togglePage(page) {
  // 展开/折叠页面预览（未来可扩展）
}

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// 事件绑定
document.getElementById('search').addEventListener('input', renderDocList);
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderDocList();
  });
});

// 初始化
renderDocList();
// 自动选第一个
if (DATA.length > 0) selectDoc(DATA[0].document_id);
</script>
</body>
</html>
