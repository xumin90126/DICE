<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 500" width="1020" height="500">
<rect width="1020" height="500" fill="#FFFFFF"/>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker></defs>
<text x="510" y="35" font-size="18" font-weight="bold" fill="#1E3A8A" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Research Evolution</text>
<text x="510" y="56" font-size="11" font-weight="normal" fill="#94A3B8" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">From document understanding toward evidence boundaries and capability expansion</text>
<rect x="40" y="85" width="140" height="120" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1" rx="6"/>
<text x="110.0" y="105" font-size="10" font-weight="bold" fill="#475569" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Phase 1</text>
<text x="110.0" y="127" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Document</text>
<text x="110.0" y="140" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Understanding</text>
<text x="110.0" y="155" font-size="9" font-weight="normal" fill="#475569" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Parse, structure,</text>
<text x="110.0" y="167" font-size="9" font-weight="normal" fill="#475569" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">understand documents</text>
<line x1="183" y1="145.0" x2="198" y2="145.0" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowhead)"/>
<rect x="200" y="85" width="140" height="120" fill="#DBEAFE" stroke="#60A5FA" stroke-width="2" rx="6"/>
<text x="270.0" y="105" font-size="10" font-weight="bold" fill="#60A5FA" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Phase 2</text>
<text x="270.0" y="127" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Evidence</text>
<text x="270.0" y="140" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Quality</text>
<text x="270.0" y="155" font-size="9" font-weight="normal" fill="#475569" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Extracting is not</text>
<text x="270.0" y="167" font-size="9" font-weight="normal" fill="#475569" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">having sufficient</text>
<text x="270.0" y="179" font-size="9" font-weight="normal" fill="#475569" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">evidence</text>
<line x1="343" y1="145.0" x2="358" y2="145.0" stroke="#60A5FA" stroke-width="2" marker-end="url(#arrowhead)"/>
<rect x="360" y="85" width="140" height="120" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" rx="6"/>
<text x="430.0" y="105" font-size="10" font-weight="bold" fill="#2563EB" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Phase 3</text>
<text x="430.0" y="127" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Evidence</text>
<text x="430.0" y="140" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Sufficiency</text>
<text x="430.0" y="155" font-size="9" font-weight="normal" fill="#475569" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Exists is not</text>
<text x="430.0" y="167" font-size="9" font-weight="normal" fill="#475569" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">sufficient</text>
<text x="430.0" y="179" font-size="9" font-weight="normal" fill="#475569" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">149 cases studied</text>
<line x1="503" y1="145.0" x2="518" y2="145.0" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowhead)"/>
<rect x="520" y="85" width="140" height="120" fill="#EDE9FE" stroke="#6366F1" stroke-width="2" rx="6"/>
<text x="590.0" y="105" font-size="10" font-weight="bold" fill="#6366F1" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Phase 4</text>
<text x="590.0" y="127" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Evidence</text>
<text x="590.0" y="140" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Boundary</text>
<text x="590.0" y="155" font-size="9" font-weight="normal" fill="#475569" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Structural complete,</text>
<text x="590.0" y="167" font-size="9" font-weight="normal" fill="#475569" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">semantic unresolved</text>
<text x="590.0" y="179" font-size="9" font-weight="normal" fill="#475569" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">13 boundary cases</text>
<line x1="663" y1="145.0" x2="678" y2="145.0" stroke="#6366F1" stroke-width="2" marker-end="url(#arrowhead)"/>
<rect x="680" y="85" width="140" height="120" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" rx="6"/>
<text x="750.0" y="105" font-size="10" font-weight="bold" fill="#F59E0B" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Phase 5</text>
<text x="750.0" y="127" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">G5 Semantic</text>
<text x="750.0" y="140" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Boundary</text>
<text x="750.0" y="155" font-size="9" font-weight="normal" fill="#475569" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Formalized as G5</text>
<text x="750.0" y="167" font-size="9" font-weight="normal" fill="#475569" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">CONDITIONALLY</text>
<text x="750.0" y="179" font-size="9" font-weight="normal" fill="#475569" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">SUPPORTED</text>
<line x1="823" y1="145.0" x2="838" y2="145.0" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowhead)"/>
<rect x="840" y="85" width="140" height="120" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1" rx="6"/>
<text x="910.0" y="105" font-size="10" font-weight="bold" fill="#475569" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Phase 6</text>
<text x="910.0" y="127" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Capability</text>
<text x="910.0" y="140" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Expansion</text>
<text x="910.0" y="155" font-size="9" font-weight="normal" fill="#475569" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Future research</text>
<text x="910.0" y="167" font-size="9" font-weight="normal" fill="#475569" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">FUTURE_RESEARCH</text>
<rect x="40" y="245" width="460" height="100" fill="#DBEAFE" stroke="#2563EB" stroke-width="1" rx="6"/>
<text x="60" y="270" font-size="12" font-weight="bold" fill="#1E3A8A" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Key Discovery: Availability is not Sufficiency</text>
<text x="60" y="293" font-size="10" font-weight="normal" fill="#475569" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">149 cases: 55 had available but insufficient evidence</text>
<text x="60" y="310" font-size="10" font-weight="normal" fill="#475569" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Only 65 had both available AND sufficient evidence</text>
<text x="60" y="327" font-size="10" font-weight="italic" fill="#475569" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Existence is only the first layer of evidence quality</text>
<rect x="530" y="245" width="460" height="100" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1" rx="6"/>
<text x="550" y="270" font-size="12" font-weight="bold" fill="#F59E0B" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Key Discovery: Evidence Boundary Genuinely Exists</text>
<text x="550" y="293" font-size="10" font-weight="normal" fill="#475569" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">13 cases pass all B1-B6 criteria + C1-C4 counterfactuals</text>
<text x="550" y="310" font-size="10" font-weight="normal" fill="#475569" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Structural complete, but semantic identity unresolved</text>
<text x="550" y="327" font-size="10" font-weight="italic" fill="#475569" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Not an artifact of missing data</text>
<rect x="40" y="370" width="950" height="70" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="6"/>
<text x="60" y="395" font-size="11" font-weight="bold" fill="#475569" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Status:</text>
<text x="115" y="395" font-size="10" font-weight="bold" fill="#2563EB" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Evidence Boundary = CONDITIONALLY_SUPPORTED</text>
<text x="115" y="415" font-size="10" font-weight="bold" fill="#2563EB" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">G5 Generalization = CONDITIONALLY_SUPPORTED</text>
<text x="530" y="395" font-size="10" font-weight="bold" fill="#DC2626" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Automatic Detection = NOT_IMPLEMENTED</text>
<text x="530" y="415" font-size="10" font-weight="bold" fill="#94A3B8" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Capability Expansion = FUTURE_RESEARCH</text>
<text x="510" y="485" font-size="9" font-weight="normal" fill="#94A3B8" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Figure 3. Evolution of the DICE research direction.</text>
</svg>