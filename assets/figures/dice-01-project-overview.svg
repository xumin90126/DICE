<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580">
<rect width="1000" height="580" fill="#FFFFFF"/>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker></defs>
<text x="500" y="35" font-size="18" font-weight="bold" fill="#1E3A8A" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">DICE — Evidence Intelligence for Enterprise Document Understanding</text>
<text x="500" y="56" font-size="11" font-weight="normal" fill="#94A3B8" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Research Project · Experimental · Research-in-progress</text>
<rect x="30" y="80" width="450" height="180" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" rx="6"/>
<text x="50" y="108" font-size="15" font-weight="bold" fill="#1E3A8A" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">What is DICE?</text>
<text x="50" y="132" font-size="11" font-weight="normal" fill="#475569" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">DICE investigates whether the evidence</text>
<text x="50" y="150" font-size="11" font-weight="normal" fill="#475569" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">extracted from enterprise documents is:</text>
<text x="60" y="174" font-size="11" font-weight="normal" fill="#475569" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">• Sufficient — meets a completeness threshold</text>
<text x="60" y="194" font-size="11" font-weight="normal" fill="#475569" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">• Validated — human-confirmed where needed</text>
<text x="60" y="214" font-size="11" font-weight="normal" fill="#475569" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">• Reusable — packaged as capability artifacts</text>
<text x="60" y="234" font-size="11" font-weight="normal" fill="#475569" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">• Governable — controlled evidence-to-capability path</text>
<rect x="520" y="80" width="450" height="180" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" rx="6"/>
<text x="745" y="108" font-size="15" font-weight="bold" fill="#475569" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">RAG vs DICE</text>
<rect x="540" y="125" width="195" height="115" fill="#FFFFFF" stroke="#2563EB" stroke-width="1" rx="6"/>
<text x="637" y="150" font-size="14" font-weight="bold" fill="#2563EB" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">RAG</text>
<text x="637" y="173" font-size="10" font-weight="normal" fill="#475569" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Retrieves information</text>
<text x="637" y="190" font-size="10" font-weight="normal" fill="#475569" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Finds and presents</text>
<text x="637" y="207" font-size="10" font-weight="normal" fill="#475569" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">relevant content</text>
<rect x="755" y="125" width="195" height="115" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" rx="6"/>
<text x="852" y="150" font-size="14" font-weight="bold" fill="#1E3A8A" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">DICE</text>
<text x="852" y="173" font-size="10" font-weight="normal" fill="#475569" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Investigates whether</text>
<text x="852" y="190" font-size="10" font-weight="normal" fill="#475569" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">evidence is sufficient,</text>
<text x="852" y="207" font-size="10" font-weight="normal" fill="#475569" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">validated, governable</text>
<text x="745" y="262" font-size="10" font-weight="italic" fill="#94A3B8" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">DICE is not intended to replace RAG or Agents.</text>
<text x="745" y="278" font-size="10" font-weight="italic" fill="#94A3B8" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">They can occupy different layers.</text>
<rect x="30" y="290" width="940" height="210" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="6"/>
<text x="50" y="316" font-size="15" font-weight="bold" fill="#1E3A8A" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Key Questions</text>
<line x1="50" y1="326" x2="950" y2="326" stroke="#CBD5E1" stroke-width="1"/>
<text x="55" y="350" font-size="12" font-weight="bold" fill="#2563EB" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Q1</text>
<text x="90" y="350" font-size="11" font-weight="normal" fill="#475569" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">How to effectively understand and organize document content?</text>
<text x="55" y="378" font-size="12" font-weight="bold" fill="#2563EB" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Q2</text>
<text x="90" y="378" font-size="11" font-weight="normal" fill="#475569" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">How to determine whether evidence is sufficient?</text>
<text x="55" y="406" font-size="12" font-weight="bold" fill="#2563EB" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Q3</text>
<text x="90" y="406" font-size="11" font-weight="normal" fill="#475569" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">How to incorporate human validation into the loop?</text>
<text x="55" y="434" font-size="12" font-weight="bold" fill="#2563EB" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Q4</text>
<text x="90" y="434" font-size="11" font-weight="normal" fill="#475569" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Where are the boundaries of machine capability?</text>
<text x="55" y="462" font-size="12" font-weight="bold" fill="#2563EB" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Q5</text>
<text x="90" y="462" font-size="11" font-weight="normal" fill="#475569" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">How to enable safe and effective capability expansion?</text>
<rect x="30" y="510" width="940" height="40" fill="#FEF2F2" stroke="#DC2626" stroke-width="1" rx="6"/>
<text x="50" y="535" font-size="11" font-weight="bold" fill="#DC2626" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">DICE is NOT:</text>
<text x="135" y="535" font-size="11" font-weight="normal" fill="#475569" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">RAG replacement · Agent · Autonomous Runtime · Production system · Generic parser</text>
<text x="500" y="568" font-size="9" font-weight="normal" fill="#94A3B8" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">Figure 1. Project overview of DICE and its distinction from conventional retrieval- and agent-oriented systems.</text>
</svg>